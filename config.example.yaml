# ai-gateway configuration example
#
# Precedence: built-in defaults < this file < GW_* environment variables.
# Most fields mirror config.Default(); see internal/config/config.go for the full list.

server:
  listen: ":8080"
  secret_key: "change-me-session-signing-key"
  read_timeout_s: 30
  max_body_bytes: 10485760
  # Mount the whole surface (data plane + console + management API) under one URL
  # prefix, for a reverse proxy that forwards the prefix instead of stripping it:
  #   nginx:  location /aigw/ { proxy_pass http://127.0.0.1:8080; }
  #   URLs:   https://<host>/aigw/admin/ui/  and  https://<host>/aigw/v1/responses
  # Empty (the default) serves everything from the root. Paths the server generates
  # itself — the aigw_admin cookie's Path, the console's /admin/ui/ redirect — carry
  # the prefix, so a browser never has to guess it.
  base_path: ""

database:
  path: "./data/aigw.db"
  busy_timeout_ms: 5000
  wal: true
  max_open_conns: 16        # 1 writer + readers (WAL allows concurrent reads)

auth:
  default_grant: all        # all|none - keys without tags/grants get everything
  key_cache_ttl_s: 30

plugins:
  dir: "./plugins"
  extra: []
  state_dir: "./data/plugin-state"
  start_timeout_s: 3
  ping_interval_s: 15
  max_restarts_per_min: 5
  log_tail_lines: 200
  restart_drain_grace_s: 30
  restart_force_s: 600

routing:
  default_strategy: weighted_random   # weighted_random|round_robin|least_inflight|least_latency|strict_order
  max_attempts: 3
  per_attempt_timeout_s: 120
  ttft_timeout_s: 60
  total_budget_s: 600
  degradation: strip                  # strip|reject
  quota_cooldown_default_s: 1800
  breaker:
    failures: 5
    window_s: 60
    cooldown_s: 30
  model_fallback: ""                  # catch-all model when nothing matches
  # 会话粘性：同一 API Key + session_id + canonical 模型 的连续请求复用上次成功的 route。
  # 只在同一 priority 层内重排（strict_order 不重排），因此不会放宽 key 的授权；
  # 不带 prompt_cache_key 的请求完全不受影响。进程内状态，重启后重新负载均衡。
  session_affinity: true
  session_affinity_ttl_s: 1800        # 无新成功请求则过期（命中即刷新）
  session_affinity_max_entries: 10000 # 表容量上界（session_id 由客户端提供）
  # 供应商并发上限（每个供应商实例的 providers.max_inflight，0=不限）触发后的排队策略。
  # 超出并发的请求在进程内 FIFO 排队等待名额；等待超过 provider_queue_wait_s 或队列超过
  # provider_queue_max_waiters 时，该次尝试按可重试失败换下一个候选，全部候选耗尽返回
  # 429 provider_busy。provider_queue_wait_s: 0 = 不排队（超限立即失败）。
  # 约束：provider_queue_wait_s × max_attempts 必须小于 billing.reservation_ttl_s
  # （排队期间请求仍持有余额预留，等太久会让预留先过期）。
  provider_queue_wait_s: 30           # 排队最长等待秒数；0=不排队
  provider_queue_max_waiters: 100     # 每个供应商最多排队请求数；0=不限（仍受等待时长约束）

billing:
  currency: USD                       # ledger currency: balance, credit, reservations, ledger, invoices, reconcile
  display_currency: USD               # console default display currency (must be the ledger or have an fx rate)
  fx_rates: {}                        # 1 unit of the currency = N micros of the ledger currency, e.g. {CNY: 141000} = 1 CNY = 0.141000 USD
  default_markup_bp: 10000            # cost_follow default multiplier (10000 = 1.0x)
  basis_default: cost_follow          # cost_follow|absolute
  peak_boundary: request_start        # request_start|completion (off-peak window attribution)
  reasoning_counts_as_output: true
  per_request_fee_scope: attempt      # attempt|request
  min_charge_micros: 0
  charge_on_error: false
  charge_estimated: true
  charge_partial: true                # aborted streams are charged for metered usage only
  record_partial_cost: true
  prepaid_enforce: true
  reject_as_429: false
  monthly_usage_conditions: false
  # reservation / in-flight accounting
  reservation_mode: max_tokens        # max_tokens|fixed|hybrid
  reserve_micros_default: 20000
  default_max_output_tokens: 4096
  reservation_ttl_s: 660
  reservation_heartbeat_s: 15
  inflight_check_interval_ms: 1000
  inflight_policy: abort              # warn|throttle|abort|allow_overdraft
  inflight_soft_ratio: 0.8
  inflight_hard_ratio: 1.0
  overdraft_limit_micros: 0
  overshoot_policy: absorb            # absorb|overdraft
  inflight_estimate: chars4           # chars4|off
  cancel_grace_ms: 1500
  unavailable_charge_policy: charge_estimated   # charge_estimated|charge_reserved|charge_zero
  # invoicing / reconciliation
  low_balance_ratio: 0.1
  auto_suspend_default: false
  auto_resume_default: false
  invoice_period: monthly
  period_start_day: 1
  timezone: UTC
  fallback_file: "./data/billing-fallback.jsonl"
  reconcile_cron: "0 3 * * *"
  # single-writer settlement batching
  writer_batch_size: 256
  writer_flush_interval_ms: 20
  writer_queue_size: 65536

recording:
  # 输入通道四档（可在控制台按 Key 覆盖）：
  #   user     - 只记用户自己写的输入（默认）：user 消息原样保留，系统/开发者指令、工具定义、
  #              工具调用与工具输出、历史 assistant 轮次只留 omitted 计数与 request_bytes
  #   full     - 整份请求正文（排障用：上游 400 需要客户端原样字节时临时打开）
  #   metadata - 不落正文，只留体积/状态等列内元数据
  #   off      - 不落正文（仍会写一行请求日志：状态、体积与身份维度都在，只是没有正文）
  #
  # 注意：客户端/模型/工作区/会话/调用类型/标题这些身份维度（M27）不受本开关影响，只要写了
  # 日志行就一并记录——它们是元数据不是正文。要让某一列不留痕，把列名写进下面的 redact_paths。
  # 用户（账户）与 API Key（M30）同样不受本开关影响，但它们来自**凭据本身**（account_id /
  # api_key_id），不是请求正文解析出来的，因此也**不参与 redact_paths**：要让某个 Key 不留痕，
  # 手段是停用该 Key。名字（account_name / api_key_name）是查询时从账户/Key 表现取的，日志行
  # 只存 id。
  record_input: user
  record_reasoning: false     # "save thinking text" checkbox - off by default, per key
  record_output_text: false   # "save final output text" checkbox - off by default, per key
  # 会话标题（M27）：客户端的标题调用产出的标题，记在那一行请求日志上。它是会话级元数据而不是
  # 用户问题的答案，因此单独开关且默认开。关掉后 call_kind=title 仍会被识别，只是不记标题文本。
  record_title: true
  max_bytes: 1048576
  # 记录内容的保留期：请求日志按它清理，存储响应（store=true）按它到期；0 = 不清理（永久保留）。
  # 清理是每日任务（启动时跑一次），也可在控制台「请求日志」页手动触发；
  # 计费（usage/ledger）与审计记录不受影响。
  retention_days: 30
  # 历史小时读汇总，当前小时和失效小时实时补算；关闭则全部读明细。后台每 30 秒处理。
  dimension_rollup_enabled: true
  redact_paths: []
  queue_size: 16384
  # 审计写入批量化（M26）。开 = 请求路径把「存储响应 + 请求日志」交给后台线程，在一个事务里
  # 成批落库；关 = 每请求同步写两行（老行为，行在 handler 返回前落库）。
  # 为什么默认开：写连接池只有 1 条连接，同步写意味着每个请求独占它一次（含一次 fsync）；
  # 8088 实例的 goroutine dump 抓到过 6 个请求 goroutine 卡在 database/sql 等这条连接。
  # 实测（16 并发小请求 60s，同一台机器 A/B）：186 rps 对 63 rps；每请求 CPU 0.82ms 对 2.57ms；
  # p50 4.3ms 对 16.3ms；p90 17ms 对 480ms。
  # 代价：审计行最多晚 batch_flush_ms 落库；硬杀进程会丢最后这个窗口的行
  #（`scripts/local-run.sh stop`/SIGTERM 是优雅关闭，先排空队列再退出，不丢行）。
  # 读一致性：POST 之后按 id GET 刚拿到的响应不会 404 —— 该 id 若还在队列里会先等它落库。
  batch_writes: true
  batch_flush_ms: 250        # 一行最多等多久；调小 = 审计更实时、事务更多
  batch_max_rows: 256        # 一个事务最多带多少个请求
  batch_max_bytes: 16777216  # 一个事务最多带多少字节（记录正文可能很大，所以也按字节设上限）
  # 在内存里排队的上限。写侧跟不上时，请求路径在这里施加背压（等写入推进），而不是无限
  # 堆积：无限队列既是无界内存，也让优雅关闭排不空（实测 700KB 请求持续 116 rps 时，
  # 队列涨到 350MB、关停排空超时）。等不到空位的那一行会走骨架行兜底并计入 dropped。
  batch_queue_rows: 4096
  batch_queue_bytes: 33554432

mcp:
  enabled: true
  max_query_rows: 1000
  request_window_days: 30
  # Administrative tools over MCP (admin_endpoints / admin_describe / admin_request).
  # The real gate is the token scope: only a token issued with scope=admin_read or
  # scope=admin ever sees these tools, and existing tokens stay scope=query. Set this
  # to false to switch the whole surface off for the deployment.
  admin_tools: true
  # Cap on one administrative call's response body; a larger answer is truncated and
  # flagged instead of being pasted into the model's context.
  admin_max_response_bytes: 262144

# 控制台「智能问答」与「技能库」（M32）。
#
# 权限模型：智能问答就是一个 MCP 客户端。每个会话在新建时绑定一个 MCP 令牌，工具面与
# 可执行范围完全由该令牌的 scope 决定——query 只能查本账户用量，admin_read 可读后台只读
# 接口，admin 等同于管理员凭据（可发 Key、动账、删除等）。因此本页没有任何「写开关」：
# 想收紧权限就给会话绑一个 scope 更小的令牌，想收回权限就在 MCP 令牌页撤销该令牌（下一次
# 工具调用立即失效）。后台能力要求 mcp.enabled 与 mcp.admin_tools 同时为 true。
chat:
  enabled: true
  # 步数与工具调用次数：0 = 不限制（默认）。一次提问会一直进行到模型不再调用工具为止；
  # 每多一步都是一条按所选 API Key 计费的模型请求，所以想让「一次点击」的花费有上界时
  # 把它们设成正整数——达到上限会停止本轮并在页面上提示。负数会被配置校验拒绝。
  max_steps: 0
  max_tool_calls: 0
  # 单个工具结果回灌给模型前的大小上限（超出会截断并在结果里标注）。
  max_tool_result_bytes: 65536
  # 回灌给模型的历史窗口：按整轮裁剪，绝不切开一次工具调用。
  max_history_messages: 40
  max_history_bytes: 262144
  # 技能：每个会话最多加载几个、单个技能的指令字节上限（技能库本身不限量）。
  max_loaded_skills: 12
  max_skill_bytes: 16384
  # 是否把模型的思考过程随消息保存（只在会话里可见，不进全局请求日志）。
  record_reasoning: true
  # HTML5/SVG 预览：正文上限、每个会话保留份数、票据有效期。
  artifact_max_bytes: 262144
  artifact_max_per_session: 50
  artifact_ticket_ttl: 5m
  # 允许预览页加载外部资源（CDN 图表库等）。默认 false：模型写的页面不会把你的浏览器
  # 变成对外发起请求的客户端。打开它等于信任模型生成的页面。
  artifact_allow_network: false
  # 允许「可交互预览」：模型生成的 HTML5 页面可以带表单，用户填写提交后事件回到同一个会话
  # （成为一条正常计费的模型请求），模型的回答再原地更新页面。默认 true。
  # 设成 false = 预览退回只读：服务端不再向页面注入桥接脚本，页面里的按钮不会产生任何模型
  # 请求（预览、复制源码、新标签打开都照常）。这是部署级开关，与 artifact_allow_network 无关。
  ui_bridge_enabled: true
  # 单步回答的 token 上限，0 = 用供应商默认值。
  max_output_tokens: 0
  # 空 = 使用内置指令（含工具用法、图表规格、HTML 沙箱边界、可交互界面契约）。
  system_prompt: ""

hooks:
  queue_size: 1024
  workers: 8
  timeout_s: 5
  retries: 5
  dead_letter: "./data/hooks-dead.jsonl"
  # Allow http:// webhook targets. Keep false in production: payloads and HMAC
  # signatures would otherwise travel in plaintext.
  allow_insecure: false

ratelimit:
  shards: 64

backup:
  enabled: true
  dir: "./data/backups"
  cron: "30 3 * * *"
  retention_daily: 7
  retention_weekly: 4
  retention_monthly: 3
  verify: true

log:
  level: info                 # debug|info|warn|error
  format: text                # text|json

# DSH multi-tenant gateway (M58): aigw starts and supervises a sibling `dshgw` process.
# See docs/dshgw.md; the standalone shape has its own example under deploy/dshgw/.
dshgw:
  enabled: false              # true starts the child at startup and stops it when aigw exits
  # public_host + portal_port are the tenant-facing surface the child binds itself (there is
  # no nginx in this shape). They also decide the DSH portal URL the Feishu login returns to.
  public_host: "chat.tirisen.hk"
  portal_port: 32600
  # public_scheme is how browsers actually reach that surface. "auto" (the child's own
  # default) presumes https in port mode; a plain-HTTP deployment must say "http", or the
  # child issues Secure cookies that the browser silently discards.
  public_scheme: auto         # auto|http|https
  # Paths (M63, see docs/deployment-layout.md): the child's state defaults to
  # "<database.path 所在目录>/dshgw" — i.e. ./data/dshgw with the defaults above — and its
  # template/tenant/workspace/backup roots derive from it. Relative values are resolved
  # against the deployment root (the unit's WorkingDirectory), so a deployment never has to
  # write its own absolute prefix; only the dsh runtime is machine-specific.
  #
  # state_dir: ./data/dshgw     # optional: unset = <database.path 所在目录>/dshgw
  # template_home: ./data/dshgw/template-home   # built by deploy/dshgw/prepare-template.sh
  # plugin_path: ./cmd/dshgw/plugin/picker-clamp.js
  #   ↑ required while the child's directory_picker is clamp (its default): the picker is a
  #     plugin the tenant worker imports, and an unset path is refused at startup instead of
  #     silently falling back to an installation path.
  # node_bin / current_link: empty reads DSHGW_NODE / DSHGW_DSH_ROOT (runtime installs).

# Feishu (Lark) identity (M60/M61): bind API keys to Feishu accounts, and let those people
# sign in to the DSH portal without pasting a key. Off by default, and while it is off
# nothing in this block is read. See docs/feishu.md for the developer-console steps.
feishu:
  enabled: false
  app_id: ""                  # 凭证与基础信息 → App ID (cli_…)
  app_secret: ""              # 凭证与基础信息 → App Secret; prefer GW_FEISHU_APP_SECRET
  # The absolute URL registered under 安全设置 → 重定向 URL, exactly as the browser sees it
  # (this deployment puts aigw behind the front proxy on 8090). Exactly one URL is
  # registered: it serves both the console binding and the portal login. Its path must be
  # "<server.base_path>/feishu/callback".
  callback_url: ""
  scopes: ""                  # empty is right: the open id and the name need no permission
  dsh_login: true             # open the DSH portal login flow (needs the portal URL below)
  # 绑定成功后自动为该账号启用 DSH（等价于在账户页点一次「启用 DSH」），这样绑完就能登录；
  # 它只会启用「从未启用过」的账号：被显式停用过的账号保持停用，控制台会提示需手动启用。
  auto_enable_dsh: true
  portal_url: ""              # DSH portal URL; empty derives it from the dshgw block above
  state_ttl_s: 600            # how long one consent screen may stay open
  ticket_ttl_s: 120           # how long the handoff ticket to dshgw stays valid
  # Signing keys are optional: empty derives a purpose-bound key from credentials_key, and
  # the supervised dshgw child receives the derived ticket key in its generated config.
  state_secret: ""
  ticket_secret: ""

# AES-GCM key for provider credentials at rest; override with GW_CREDENTIALS_KEY in production.
credentials_key: "change-me-32-byte-encryption-key!!"

bootstrap:
  mode: upsert                # upsert|merge|off
  admin:
    username: admin
    password: "change-me-admin-password"
  accounts:
    # 名称去除首尾空白后须非空，最多 64 个 Unicode 字符；可用邮箱、中文等。
    - name: internal
      billing_mode: postpaid
      credit_limit_usd: 1000
      # Every API Key under this account inherits these tags.
      tags: [internal]
  api_keys:
    - name: dev
      key: "sk-gw-REPLACE-ME"
      account: internal
      tags: [free]
  # Optional: seed the routing graph on first start (upsert = only create what is missing).
  #
  # openai-chat speaks /chat/completions. Extra keys (all optional, defaults keep the
  # plain OpenAI-compatible behaviour):
  #   thinking.mode                  auto|enabled|disabled   - who decides whether the model thinks
  #                                  auto: the client's reasoning.effort decides. A client that
  #                                  sends no reasoning field gets no thinking field at all, so the
  #                                  upstream default applies (DeepSeek's default is on); sending
  #                                  "disabled" there would strip the chain of thought from every
  #                                  client that does not speak the field — DSH pointed at this
  #                                  gateway sends none, and stops tasks mid-way without it.
  #   thinking.style                 none|deepseek           - deepseek sends {"thinking":{"type":...}}
  #   thinking.replay_reasoning_content bool                 - send earlier reasoning back on tool turns
  #   response_format                text|json_object|json_schema - highest level the upstream accepts
  #   default_max_output_tokens      int                     - applied only when the client sent none
  #   proxy                          string                  - egress proxy: http://host:port,
  #                                  https://host:port, socks5://host:port, or the literal "env" to
  #                                  follow HTTPS_PROXY/NO_PROXY. Empty means a DIRECT connection and
  #                                  deliberately ignores the environment, so an upgrade never
  #                                  reroutes an existing deployment; credentials, when the proxy
  #                                  needs them, go in the URL (http://user:pass@host:port). A
  #                                  malformed value fails the build loudly instead of degrading to
  #                                  a direct connection that looks like "the upstream is down".
  providers:
    - name: local-chat
      kind: openai-chat            # builtin: openai-responses | openai-chat ; or plugin:<name>
      display_name: "Local OpenAI-compatible upstream"
      enabled: false               # flip to true once base_url / credentials are configured
      priority: 10
      weight: 100
      config:
        base_url: "http://127.0.0.1:11434/v1"
      models:
        - public: llama-local
          upstream: "llama3.1:8b"
          capabilities: {stream: true, tools: false}
    # DeepSeek: the same builtin provider with its thinking dialect switched on.
    # Set the API key on the provider (admin console -> Providers -> credentials
    # {"api_key":"sk-..."} or GW_* env), then enable it.
    - name: deepseek
      kind: openai-chat
      display_name: "DeepSeek"
      enabled: false
      priority: 10
      weight: 100
      config:
        base_url: "https://api.deepseek.com/v1"
        thinking:
          mode: auto                   # auto = the client's reasoning.effort decides
          style: deepseek
          replay_reasoning_content: true
        # A capability declaration, not a send switch: a request whose client did not ask
        # for JSON carries no response_format at all. Declaring json_object here used to
        # put *every* request into JSON mode, and DeepSeek then rejected any prompt that
        # did not contain the word "json" — see docs/api-providers.md §2.
        response_format: json_object   # chat/completions has no json_schema
        default_max_output_tokens: 8192
      models:
        - public: deepseek-flash
          upstream: deepseek-flash
          context_window: 1000000
          max_output_tokens: 65536
          capabilities: {stream: true, tools: true, reasoning: true, json_object: true}
        - public: deepseek-v4-pro
          upstream: deepseek-v4-pro
          context_window: 1000000
          max_output_tokens: 65536
          capabilities: {stream: true, tools: true, reasoning: true, json_object: true}
    # Gemini through Google's official OpenAI-compatibility layer. Two things are
    # specific to it (measured 2026-09-15, see docs/api-providers.md §4):
    #   * generativelanguage.googleapis.com is not reachable from a direct connection
    #     here, so `proxy` is not optional — the same SOCKS5 egress the codex provider
    #     uses works. Leave the proxy out only if this host has a direct route.
    #   * the thinking dialect must stay `none`: Gemini rejects DeepSeek's
    #     {"thinking":{...}} shape. A client's reasoning.effort is then forwarded as
    #     `reasoning_effort`, which is exactly what Gemini expects.
    # Set the API key on the provider (console -> Providers -> credentials
    # {"api_key":"AIza..."}, sealed with credentials_key) and flip enabled to true.
    # Streaming needs no special configuration: the compatibility layer accepts
    # stream_options.include_usage and ends the SSE stream with [DONE].
    - name: gemini
      kind: openai-chat
      display_name: "Gemini（Google OpenAI 兼容层）"
      enabled: false
      priority: 40
      weight: 100
      config:
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
        proxy: "socks5://127.0.0.1:1080"
        timeout_s: 120
        # No `thinking` block on purpose — see above.
      models:
        - public: gemini-2.5-flash
          upstream: gemini-2.5-flash
          context_window: 1048576
