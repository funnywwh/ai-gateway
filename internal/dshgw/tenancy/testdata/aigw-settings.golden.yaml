agent-default-model:
    model: deepseek-flash
    provider: aigw
llm-pi-ai:
    providers:
        aigw:
            apiKeyEnv: AIGW_API_KEY
            api: openai-responses
            baseURL: http://aigw:8088/v1
            models:
                - id: deepseek-flash
                  name: DeepSeek Flash
                  contextWindow: 1000000
                  maxTokens: 65536
                  input:
                    - text
                    - image
                  reasoningEfforts:
                    "off": none
                    minimal: minimal
                    low: low
                    medium: medium
                    high: high
                    xhigh: xhigh
                    max: max
                - id: forced-model
                  name: Forced Model
                - id: legacy-model
                  name: legacy-model
                - id: plain-model
                  name: plain-model
                  reasoningEfforts: false
                - id: u2-flash
                  name: u2-flash（unisound）
                  reasoningEfforts: false
            compat:
                supportsStrictMode: true
            maxRequestImageBytes: 7340032
