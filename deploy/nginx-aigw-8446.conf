# ai-gateway 的 nginx 入口：https://<host>:8446 -> http://127.0.0.1:8088
#
# 为什么需要它：aigw 监听 *:8088，但浏览器里的 127.0.0.1 指的是“浏览器所在的那台
# 机器”，不是这台服务器。本机 DSH GUI 之所以能用 127.0.0.1:3080 打开，是因为你走的是
# nginx 的 8443（见 dsh-web-8443.conf）或 SSH 隧道；而 8088 没有任何入口映射到你本地。
#
# 安装（需要 root）：
#   sudo cp deploy/nginx-aigw-8446.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 之后访问：https://192.168.190.86:8446/admin/ui/
#
# 与 dsh-web-8443.conf 的区别：DSH 有 browser-trust fence（比较 Origin 与 Host），
# 所以那份配置要改写 Host、清空 Origin/Sec-Fetch-*。aigw 的管理面**不做** Origin/Host
# 校验，前端也全部使用同源相对路径（实测 app.js / api.js / ui.js 无硬编码 host 或端口），
# 因此这里保持最朴素的透传即可，不需要那些头部手术。
#
# 关于 Cookie：aigw 的会话 Cookie 为 aigw_admin，Path=/admin、HttpOnly、
# SameSite=Lax，且**未**设置 Secure —— 所以走 HTTP 或 HTTPS、经根路径反代都能正常登录。
server {
    listen 8446 ssl;
    listen [::]:8446 ssl;
    server_name rag-server 192.168.190.86 _;

    ssl_certificate     /etc/nginx/ssl/rag-server.crt;
    ssl_certificate_key /etc/nginx/ssl/rag-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Responses API 会走 SSE 流式（/v1/responses?stream=true），必须关掉缓冲，
        # 否则前端只能等到整段响应结束才看到内容。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
