# dshgw 配置示例（M58 形态：dshgw 是 aigw 的子进程，以同一个非特权账号运行）
#
# 两种用法：
#  1) 由 aigw 生成（推荐）：aigw 在启动 dshgw 前把这份配置写到自己的数据目录
#     （<aigw 数据根>/dshgw/config.yaml），路径全部由 aigw 解析成绝对路径；
#  2) 手工跑 `dshgw serve`：默认配置路径是部署根的 ./dshgw.yaml（`-config` 可覆盖）。
#
# 关于路径（M63，见 docs/deployment-layout.md）：
#   * 数据一律落在部署根的 ./data 之下；下面的相对路径以**进程工作目录**为基准，
#     加载时会归一成绝对路径。要写到别处请写绝对路径（`..` 不允许）。
#   * 运行时安装（dsh/node、bwrap、TLS 证书）不是数据，必须是绝对路径；留空则读
#     DSHGW_NODE / DSHGW_DSH_ROOT 环境变量。
#   * 本示例给出的是"单机部署"值：先用 `dshgw doctor` 看它在你机器上缺什么。
#
# 已删除的键（旧 root/systemd/nginx 形态）：deploy.systemd_dir / nginx_dir /
# nginx_include_path / nginx_binary / dshgw_binary / corepack_bin / worker_unit /
# worker_unit_bwrap / worker_slice / gateway_unit / dsh_user_prefix / public_listen /
# gateway_group / isolation，以及顶层 tls。严格解码器会拒绝它们。
public_host: chat.tirisen.hk
portal_port: 32600
tenant_port_lo: 32601
tenant_port_hi: 32799
worker_port_lo: 32100
worker_port_hi: 32299
listen: 127.0.0.1:3099          # dshgw 自己的监听地址；无 nginx 时租户端口由它直接服务
edge_port_header: X-DSHGW-Port
max_header_bytes: 131072
max_sessions: 10000
aigw_base_url: http://192.168.190.86:8088
validate_timeout: 5s
session_ttl: 168h
key_revalidate: off              # off | per-request | interval:<seconds>
dsh_enforce: login               # login | per-request | interval:<seconds>
# 控制台「启用/停用 DSH」用的本地通道默认在 <state_dir>/admin.sock（rootless 形态下它
# 属于当前账号，只接受同 UID 连接）；想放到别处再显式给出：
# admin_socket: /run/user/1000/dshgw/admin.sock
login_rate:
  requests: 10
  window: 1m
directory_picker: clamp          # clamp | browse
plugin_browser_fs: on
workspace_seed: [work]
reserved_names: [login, dshgw]
state_dir: ./data/dshgw           # 数据根；下面未写出的 state 路径都由它派生
# 运行时安装（本机实际位置；也可以用 DSHGW_NODE / DSHGW_DSH_ROOT 环境变量）
dsh:
  node_bin: /home/winger/.local/node-v22.23.1-linux-x64/bin/node
  bin_js: /home/winger/.local/dsh-0.1.2-rc.1/lib/bin.js
  current_link: /home/winger/.local/dsh-0.1.2-rc.1
deploy:
  # 目录选择器插件没有默认值：directory_picker 为 clamp 时**必须**给出，否则配置加载失败。
  # 本仓库自带一份：cmd/dshgw/plugin/picker-clamp.js（相对部署根即可）。
  plugin_path: ./cmd/dshgw/plugin/picker-clamp.js
  gateway_user: winger           # 网关自己以谁运行（aigw 的账号）
  worker_user: winger            # 所有租户 worker 以谁运行：必须是已存在的非 root 账号
  bwrap_bin: /usr/bin/bwrap
  # 门户与租户公开端口的绑定地址。默认 loopback：对外暴露是显式决定（并且需要 TLS）。
  public_listen: 127.0.0.1
# 无 nginx 后由 dshgw 自己终止 TLS；两项都留空表示明文（仅限可信网络）。
# tls:
#   certificate: /path/fullchain.pem
#   certificate_key: /path/privkey.pem

# 飞书登录（M61）：让被绑定的人用飞书进入自己的租户，而不是粘贴 API Key。
#
# dshgw 自己不接触飞书：应用、App Secret 与重定向 URL 都属于 aigw，aigw 确认身份后签发一张
# 一次性票据；这里只验票。因此本块不需要 app_id/app_secret，也不需要第二个回调地址。
#
# 监督形态（aigw 拉起本进程）下这两项由 aigw 自动写入生成的配置，运维无需填写；
# 独立运行 dshgw 时按下面手工填成与 aigw 相同的值。
feishu:
  enabled: false
  # 浏览器可见的 aigw 登录入口（aigw 侧 feishu.callback_url 的 origin + /feishu/login）。
  aigw_login_url: http://192.168.190.86:8090/feishu/login
  # 必须与 aigw 的 feishu.ticket_secret 相同（aigw 留空时会由 credentials_key 派生并注入本文件）。
  ticket_secret: ""
