<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>org console harness</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">AI Gateway</div>
    <nav><a href="#/org" class="active">组织架构</a></nav>
    <div id="sidebar-slot" class="sidebar-slot"></div>
    <div class="sidebar-foot"><span>admin · admin</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><h1>组织架构</h1><div id="actions" class="actions"></div></header>
    <section id="page" class="page"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" class="toasts"></div>
<script>
// The organization page drives real HTTP calls, so this view stubs fetch with a small in-memory
// tree that *changes* when the page writes to it. A stub that always answered the same snapshot
// could not tell "the page saved the members" from "the page redrew what it already had".
//
// The fixture tree is shaped so the assertions can distinguish things a flat list would hide:
//
//   总部(1)[internal] ── 研发部(2)[vip] ── 平台组(3)[free]
//                    └── 市场部(4)
//   分公司(5)
//
// Two accounts exist: acme (1, in 平台组) and root-acct (2, in 总部).

const ORG = {
  nodes: [
    { id: 1, parent_id: null, name: '总部', path: '总部', depth: 0, sort_order: 100, note: '', tags: ['internal'], account_count: 1 },
    { id: 2, parent_id: 1, name: '研发部', path: '总部/研发部', depth: 1, sort_order: 100, note: '平台与算法', tags: ['vip'], account_count: 0 },
    { id: 3, parent_id: 2, name: '平台组', path: '总部/研发部/平台组', depth: 2, sort_order: 100, note: '', tags: ['free'], account_count: 1 },
    { id: 4, parent_id: 1, name: '市场部', path: '总部/市场部', depth: 1, sort_order: 200, note: '', tags: [], account_count: 0 },
    { id: 5, parent_id: null, name: '分公司', path: '分公司', depth: 0, sort_order: 200, note: '', tags: [], account_count: 0 },
  ],
  members: {},
};

const ACCOUNTS = [
  { id: 1, name: 'acme', billing_mode: 'postpaid', status: 'active', tags: [], org_node_ids: [3], org_nodes: [{ id: 3, name: '平台组', path: '总部/研发部/平台组' }], balance_micros: 0, credit_limit_micros: 0, low_balance_threshold_micros: 0,
    dsh_enabled: true, dsh_tenant: 'dsh-acme', feishu: { bound: true, open_id: 'ou_acme', name: '李智超', bound_by: 'admin', bound_at: '2026-09-22T02:00:00Z' }, key_count: 3, active_key_count: 2 },
  { id: 2, name: 'root-acct', billing_mode: 'postpaid', status: 'active', tags: [], org_node_ids: [1], org_nodes: [{ id: 1, name: '总部', path: '总部' }], balance_micros: 0, credit_limit_micros: 0, low_balance_threshold_micros: 0,
    dsh_enabled: false, dsh_tenant: 'dsh-root', dsh_disabled_at: '2026-09-21T10:00:00Z', feishu: { bound: false }, key_count: 1, active_key_count: 0 },
  // 中文名：拼音过滤与"选中置顶"都要有中文对象才测得出来。
  { id: 3, name: '张三', billing_mode: 'postpaid', status: 'active', tags: [], org_node_ids: [], org_nodes: [], balance_micros: 0, credit_limit_micros: 0, low_balance_threshold_micros: 0,
    dsh_enabled: false, dsh_effective: true, feishu: { bound: false }, key_count: 0, active_key_count: 0 },
  { id: 4, name: '李四', billing_mode: 'postpaid', status: 'active', tags: [], org_node_ids: [], org_nodes: [], balance_micros: 0, credit_limit_micros: 0, low_balance_threshold_micros: 0,
    dsh_enabled: false, feishu: { bound: false }, key_count: 1, active_key_count: 1 },
  // 多音字：长 有 chang/zhang 两读，两种拼法都要能搜到。
  { id: 5, name: '长伟', billing_mode: 'postpaid', status: 'active', tags: [], org_node_ids: [], org_nodes: [], balance_micros: 0, credit_limit_micros: 0, low_balance_threshold_micros: 0,
    dsh_enabled: false, feishu: { bound: false }, key_count: 0, active_key_count: 0 },
  // 中英混合：候选串必须同时包含"原样字符"与"拼音"两条路，否则 研发-张三 这类名字
  // 只有整串照打才搜得到。
  { id: 6, name: 'dev-张三', billing_mode: 'postpaid', status: 'active', tags: [], org_node_ids: [], org_nodes: [], balance_micros: 0, credit_limit_micros: 0, low_balance_threshold_micros: 0,
    dsh_enabled: false, feishu: { bound: false }, key_count: 0, active_key_count: 0 },
];

function nodeRef(id) {
  const node = ORG.nodes.find((n) => n.id === id);
  return node ? { id: node.id, name: node.name, path: node.path } : null;
}

// 成员关系从账号侧派生：一个账号属于哪些节点只有一处真相（accounts.org_node_ids），
// 「这个部门有哪些账号」是它的反向索引。
function syncMemberships() {
  for (const key of Object.keys(ORG.members)) delete ORG.members[key];
  for (const account of ACCOUNTS) {
    for (const id of account.org_node_ids || []) ORG.members[id] = (ORG.members[id] || []).concat([account.id]);
  }
}

function applyAccountPatch(account, body) {
  for (const field of ['name', 'status', 'billing_mode', 'note', 'credit_limit_micros', 'low_balance_threshold_micros', 'overdraft_limit_micros', 'tags']) {
    if (body[field] !== undefined) account[field] = body[field];
  }
  if (body.org_node_ids !== undefined) {
    account.org_node_ids = body.org_node_ids.map(Number);
    account.org_nodes = account.org_node_ids.map(nodeRef).filter(Boolean);
  }
  syncMemberships();
}

syncMemberships();

window.fetch = async (url, options) => {
  const target = String(url);
  const path = target.replace(/^.*\/admin\/api\/v1/, '').split('?')[0];
  const method = (options && options.method) || 'GET';
  window.__calls = (window.__calls || []).concat([method + ' ' + target]);
  if (options && options.body) window.__sent = (window.__sent || []).concat([{ path, method, body: options.body }]);
  const ok = (payload) => ({ ok: true, status: 200, text: async () => JSON.stringify(payload) });

  if (path === '/org/nodes' && method === 'GET') {
    return ok({ data: ORG.nodes, count: ORG.nodes.length, total: ORG.nodes.length, limit: 1000, offset: 0, has_more: false });
  }
  if (path === '/accounts' && method === 'GET') {
    // M72 的字段都在这里：DSH 三态（dsh_enabled / dsh_disabled_at / dsh_effective）、账号级飞书身份、
    // Key 计数。人员行把这三件事各画一个徽标，缺一个字段那条断言就会抓到。
    return ok({ data: ACCOUNTS, count: ACCOUNTS.length, total: ACCOUNTS.length, limit: 1000, offset: 0, has_more: false });
  }
  // 账号写入真的改这份数据（新建成员 / 编辑 / 分配组织）："页面重载后看得到新归属"才是对着一个
  // 确实变了的服务端看的，而不是页面自己画的东西。
  if (path.match(/^\/accounts\/\d+$/) && method === 'PATCH') {
    const id = Number(path.split('/').pop());
    const body = JSON.parse(options.body || '{}');
    const account = ACCOUNTS.find((a) => a.id === id);
    if (!account) return ok({ error: 'not found' });
    applyAccountPatch(account, body);
    return ok(account);
  }
  if (path === '/accounts' && method === 'POST') {
    const body = JSON.parse(options.body || '{}');
    const account = {
      id: Math.max(...ACCOUNTS.map((a) => a.id)) + 1, name: body.name, billing_mode: body.billing_mode || 'postpaid',
      status: 'active', tags: body.tags || [], org_node_ids: [], org_nodes: [],
      balance_micros: 0, credit_limit_micros: body.credit_limit_micros || 0,
      low_balance_threshold_micros: body.low_balance_threshold_micros || 0,
      dsh_enabled: false, feishu: { bound: false }, key_count: 0, active_key_count: 0,
    };
    ACCOUNTS.push(account);
    applyAccountPatch(account, { org_node_ids: body.org_node_ids || [] });
    return ok(account);
  }
  // 绑定飞书人员弹窗读的是飞书通讯录。这里可以**悬挂**这次读：只有把请求按在手里，才能观察到
  // "弹窗已经打开、正在读取"那一瞬间（读得快的时候它一帧都不存在）。fixtures 里三个人分别覆盖
  // 三条路径：未绑定、已被别人绑定（置灰）、已绑给本账号（可选）。
  if (path === '/org/feishu/directory' && method === 'GET') {
    const wantsRefresh = target.includes('refresh=true');
    const answer = () => ok({
      names_available: window.__namesAvailable !== false,
      cached: !wantsRefresh,
      warnings: [],
      users: window.__directoryUsers || [
        { open_id: 'ou_a', name: '李智超', account: null, department_ids: ['od_rd'] },
        { open_id: 'ou_b', name: '王五', account: { id: 9, name: '老板' }, department_ids: ['od_rd'] },
        { open_id: 'ou_c', name: '张三', account: { id: 2, name: 'root-acct' }, department_ids: ['od_mkt'] },
      ],
    });
    if (window.__directoryError) {
      return { ok: false, status: 502, text: async () => JSON.stringify({ error: { message: window.__directoryError, code: 'upstream_error' } }) };
    }
    if (window.__holdDirectory) {
      return new Promise((resolve) => {
        window.__releaseDirectory = () => { window.__holdDirectory = false; resolve(answer()); };
      });
    }
    return answer();
  }
  // The expanded person row asks for that account's keys (M72). The list carries a worker key on
  // purpose: it must be labelled as gateway plumbing rather than offered as a person's key.
  if (path === '/keys' && method === 'GET') {
    const accountID = Number((target.split('account_id=')[1] || '0').split('&')[0]);
    if (accountID === 1) {
      return ok({ data: [
        { id: 11, account_id: 1, name: 'dshgw-dsh-acme-ab12', key_prefix: 'sk-gw-worker', status: 'active', tags: [], account_tags: [], effective_tags: [], record_input_mode: 'user', policy: {}, last_used_at: '2026-09-22T01:00:00Z', feishu: { bound: false } },
        { id: 12, account_id: 1, name: 'laptop', key_prefix: 'sk-gw-laptop', status: 'active', tags: [], account_tags: [], effective_tags: [], record_input_mode: 'user', policy: {}, last_used_at: '2026-09-21T09:00:00Z', feishu: { bound: false } },
        { id: 13, account_id: 1, name: 'phone', key_prefix: 'sk-gw-phone', status: 'suspended', tags: [], account_tags: [], effective_tags: [], record_input_mode: 'user', policy: {}, feishu: { bound: false } },
      ], count: 3, total: 3, limit: 100, offset: 0, has_more: false });
    }
    return ok({ data: [], count: 0, total: 0, limit: 100, offset: 0, has_more: false });
  }
  const memberMatch = path.match(/^\/org\/nodes\/(\d+)\/accounts$/);
  if (memberMatch) {
    const nodeID = Number(memberMatch[1]);
    if (method === 'PUT') {
      const body = JSON.parse(options.body || '{}');
      // The write is reflected in the store, so a reload shows the new membership: that is what
      // makes "saved" observable rather than merely claimed. 成员关系由账号的 org_node_ids 派生，
      // 所以这里改的是账号侧（与真实服务端同一个方向）。
      const wanted = new Set((body.account_ids || []).map(Number));
      for (const account of ACCOUNTS) {
        const has = (account.org_node_ids || []).includes(nodeID);
        if (wanted.has(account.id) && !has) account.org_node_ids = (account.org_node_ids || []).concat([nodeID]);
        if (!wanted.has(account.id) && has) account.org_node_ids = account.org_node_ids.filter((id) => id !== nodeID);
        account.org_nodes = (account.org_node_ids || []).map(nodeRef).filter(Boolean);
      }
      syncMemberships();
      return ok({ id: nodeID, account_ids: ORG.members[nodeID] || [], count: (ORG.members[nodeID] || []).length, updated: true });
    }
    const ids = ORG.members[nodeID] || [];
    return ok({
      data: ids.map((id) => ({ id, name: id === 1 ? 'acme' : 'root-acct', status: 'active' })),
      count: ids.length, total: ids.length, limit: 1000, offset: 0, has_more: false,
    });
  }
  if (path.match(/^\/org\/nodes\/\d+$/) && method === 'DELETE') {
    const id = Number(path.split('/').pop());
    // cascade=true in the page's call: drop the node and its descendants.
    const doomed = new Set([id]);
    let grew = true;
    while (grew) {
      grew = false;
      for (const node of ORG.nodes) {
        if (node.parent_id !== null && doomed.has(node.parent_id) && !doomed.has(node.id)) { doomed.add(node.id); grew = true; }
      }
    }
    ORG.nodes = ORG.nodes.filter((node) => !doomed.has(node.id));
    return ok({ id, deleted: true, nodes_deleted: doomed.size });
  }
  if (path.match(/^\/org\/nodes\/\d+$/) && method === 'PATCH') {
    const id = Number(path.split('/').pop());
    const body = JSON.parse(options.body || '{}');
    const node = ORG.nodes.find((n) => n.id === id);
    if (node) {
      if (body.name !== undefined) node.name = body.name;
      if (body.tags !== undefined) node.tags = body.tags;
      if (body.note !== undefined) node.note = body.note;
    }
    return ok(node || {});
  }
  if (path === '/org/nodes' && method === 'POST') {
    const body = JSON.parse(options.body || '{}');
    const id = Math.max(...ORG.nodes.map((n) => n.id)) + 1;
    const node = { id, parent_id: body.parent_id === undefined ? null : body.parent_id, name: body.name, path: body.name, depth: 0, sort_order: body.sort_order || 100, note: body.note || '', tags: body.tags || [], account_count: 0 };
    ORG.nodes.push(node);
    return ok(node);
  }
  // Anything else (currency lookups, stats) answers empty: this view only exercises the org page.
  return ok({ data: [] });
};
window.__org = ORG;
window.__accounts = ACCOUNTS;

const errors = [];
window.onerror = (msg) => errors.push('onerror: ' + msg);
window.onunhandledrejection = (ev) => errors.push('rejection: ' + ev.reason);

function report(data) {
  data.errors = errors;
  data.toasts = [...document.querySelectorAll('.toast')].map((n) => n.textContent);
  const url = '/report?data=' + encodeURIComponent(JSON.stringify(data));
  try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch (err) { /* fall through */ }
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
  } catch (err) { /* reporting must never break the harness */ }
}
</script>
<script type="module">
import { render as renderOrg } from '/js/pages/org.js';
import { render as renderAccounts } from '/js/pages/accounts.js';
import { initCurrency } from '/js/money.js';

const view = location.hash.replace('#', '') || 'org';
const checks = {};
const settle = async () => { for (let i = 0; i < 400; i++) await Promise.resolve(); };
const pageText = () => document.getElementById('page').textContent;
const rows = (root) => [...root.querySelectorAll('.tree-row')];
const labels = (root) => rows(root).map((row) => row.querySelector('.tree-label').textContent);
const rowOf = (root, name) => rows(root).find((row) => row.querySelector('.tree-label').textContent === name);
const find = (label) => [...document.querySelectorAll('button')].find((b) => b.textContent.trim() === label);

try {
  // The currency table is fetched by the accounts page; without it money() renders nothing.
  try { await initCurrency(); } catch (err) { /* the org page does not need it */ }

  if (view === 'org') {
    const sidebar = document.getElementById('sidebar-slot');
    const session = window.__role ? { role: window.__role, username: 'admin' } : { role: 'admin', username: 'admin' };
    await renderOrg({
      page: document.getElementById('page'), actions: document.getElementById('actions'),
      session, route: { path: '/org' }, navigate: () => {}, sidebar,
    });
    await settle();

    // 组织树只出现在工作区里。
    //
    // 侧边栏曾同时挂一份紧凑树，产品上判定为冗余（用户："左侧边栏的组织架构控件去掉"），
    // 所以这里断言的是**负向事实**：侧边栏里不得出现树。负向断言必须点名容器——不写
    // `#page .tree` 而写全局 `.tree` 计数，就没法区分"没渲染"与"渲染到别处去了"。
    checks.noSidebarTree = sidebar.querySelectorAll('.tree').length === 0;
    checks.pageTree = document.querySelectorAll('#page .tree').length === 1;
    checks.pageMode = !!document.querySelector('#page .tree-workspace');
    checks.pageRows = labels(document.getElementById('page')).length;
    checks.pageShowsDeep = labels(document.getElementById('page')).includes('平台组');
    // Sibling order comes from the server (sort_order), and the hierarchy is indented.
    checks.rootOrder = labels(document.getElementById('page')).slice(0, 1).join(',') === '总部';
    checks.indent = (() => {
      const parent = rowOf(document.getElementById('page'), '研发部');
      const child = rowOf(document.getElementById('page'), '平台组');
      return parseInt(child.style.paddingLeft, 10) - parseInt(parent.style.paddingLeft, 10) === 14;
    })();
    checks.tagsShown = pageText().includes('vip');
    checks.accountCountShown = pageText().includes('1 个账号');

    // The first node is selected on load and its detail card is rendered with its members. The
    // membership is asserted by account name: checking "the first checkbox" would pass for the
    // wrong reason as soon as the account list is ordered differently.
    checks.detailShown = pageText().includes('节点详情');
    checks.membersLoaded = !!document.querySelector('.org-member');

    // 人员列表是一张**多列表格**：表头文案齐全，且不同账号行的同一列必须从同一个 x 开始。
    //
    // 「对齐」只能量几何：文字内容一字不差，一堆换行的徽标（改造前的形态）与一张按列对齐的表
    // 在 textContent 上完全一样，所以断言必须读 getBoundingClientRect 的 left。
    const memberTable = document.querySelector('.org-member-table');
    const headLabels = memberTable
      ? [...memberTable.querySelectorAll('thead th')].map((th) => th.textContent.trim())
      : [];
    checks.memberTableHeader = ['账号', 'DSH', '飞书', 'Key', '所属组织', '操作']
      .every((label) => headLabels.includes(label));
    const rowOfPerson = (name) => [...document.querySelectorAll('.org-member')]
      .find((el) => el.textContent.includes(name));
    const cellLeft = (name, cls) => {
      const row = rowOfPerson(name);
      const cell = row ? row.querySelector('td.' + cls) : null;
      return cell ? Math.round(cell.getBoundingClientRect().left) : -1;
    };
    const columnAligned = (cls) => {
      const left = cellLeft('acme', cls);
      const right = cellLeft('root-acct', cls);
      return left >= 0 && left === right;
    };
    checks.memberColumnsAligned = ['c-name', 'c-dsh', 'c-feishu', 'c-keys', 'c-orgs', 'c-ops']
      .every(columnAligned);
    // 详情行必须横跨整行（colspan 的 td 宽度约等于表格宽度），否则展开区只占一列。
    // 隐藏的 <tr> 量出来是 0，所以先真的展开一行、量完再收起来（这一来一回本身也是收起生效的证据）。
    const acmeToggle = (() => {
      const row = [...document.querySelectorAll('.org-member')].find((el) => el.textContent.includes('acme'));
      return row ? [...row.querySelectorAll('button')].find((b) => b.textContent === '展开') : null;
    })();
    if (acmeToggle) acmeToggle.click();
    await settle();
    checks.memberDetailSpansRow = (() => {
      const table = document.querySelector('.org-member-table');
      // 取**展开着**的那一行的详情单元格：表里每个账号都有一格，第一个多半是收起来的。
      const cell = document.querySelector('.org-person-detail.open td.org-person-detail-cell');
      if (!table || !cell) return false;
      return cell.getBoundingClientRect().width >= table.getBoundingClientRect().width - 2;
    })();
    const acmeCollapse = (() => {
      const row = [...document.querySelectorAll('.org-member')].find((el) => el.textContent.includes('acme'));
      return row ? [...row.querySelectorAll('button')].find((b) => b.textContent === '收起') : null;
    })();
    if (acmeCollapse) acmeCollapse.click();
    await settle();

    // 成员行的几何：勾选框在自己的列里、不被全局 `input { width:100% }` 撑满，且与账号名垂直对齐。
    //
    // 这条坑的形态是**布局**——app.css 里全局的 `input, select, textarea { width:100% }` 命中这个
    // 没有 class 的 checkbox，把它撑满整列，账号名被推到最右边。文字内容一字不差，任何文本断言都会
    // 全绿。（与 .plus-skill / .form-radio 是同一条坑，这是第四处：表格化后勾选框换到了自己的列里。）
    const memberRow = document.querySelector('.org-member');
    const pickCell = memberRow.querySelector('td.c-pick');
    const memberBoxEl = pickCell ? pickCell.querySelector('input') : null;
    const memberNameEl = memberRow.querySelector('.org-member-name');
    // 量不到就退回一套零值：断言照样判红，但后面的检查项还能跑完（一个 throw 会让整个视图的
    // 后半段断言全部消失，那时报告只会说"page threw"，看不出究竟哪几条坏了）。
    const zeroRect = { width: 0, height: 0, left: -1, right: -1, top: 0 };
    const boxRect = memberBoxEl ? memberBoxEl.getBoundingClientRect() : zeroRect;
    const nameRect = memberNameEl ? memberNameEl.getBoundingClientRect() : zeroRect;
    const pickRect = pickCell ? pickCell.getBoundingClientRect() : zeroRect;
    checks.memberCheckboxNotStretched = boxRect.width > 0 && boxRect.width <= 20;
    // 「勾选框紧贴它的列左沿」取代了改造前的「勾选框与名字相距 ≤12px」：跨列之后那个距离由列宽
    // 决定，不再是"被撑满、名字被推走"的证据，而列对齐由 memberColumnsAligned 守着。
    checks.memberCheckboxInsidePickCell = boxRect.width > 0 && (boxRect.left - pickRect.left) <= 8;
    checks.memberVerticallyAligned = Math.abs((boxRect.top + boxRect.height / 2) - (nameRect.top + nameRect.height / 2)) <= 2;
    checks.memberRowFitsPanel = memberRow.getBoundingClientRect().width <= document.querySelector('.org-members').getBoundingClientRect().width;
    // 量到的数字放进 sample（runner 唯一豁免的信息项）：断言只说真假，数字才说明"修好了多少"。

    // --- 成员的拼音过滤 ---
    //

    const memberNames = () => [...document.querySelectorAll('.org-member-name')].map((n) => n.textContent);

    // 每次断言都按**集合**比较（排序后 join），不按顺序：行序会随"选中置顶"规则变化，

    // 失败时写 false（而不是描述字符串）并把细节推进 errors：runner 只把 false/非正数当失败，

    const expectNames = (label, query, expected) => {

    await typeSearch('zhangsan');

    expectNames('pinyinInitialsMatch', 'zs', ['张三', 'dev-张三']);
    await typeSearch('changwei');
    expectNames('pinyinPolyphoneChang', 'changwei', ['长伟']);
    await typeSearch('zhangwei');
    expectNames('pinyinPolyphoneZhang', 'zhangwei', ['长伟']);
    await typeSearch('lisi');
    expectNames('pinyinOtherName', 'lisi', ['李四']);
    await typeSearch('acme');
    expectNames('englishStillMatches', 'acme', ['acme']);

    expectNames('literalChineseStillMatches', '李', ['acme', '李四']);

    const toolbar = document.querySelector('.org-member-toolbar');

    // 替人写一次成员表。

    if (createMemberBtn) {

      checks.createMemberPrefilledNode = !!selectedNode

      checks.createMemberPosted = !!memberPost;

      checks.createMemberNamed = !!memberBody && memberBody.name === 'newbie';
      checks.createMemberCarriesNode = !!memberBody && Array.isArray(memberBody.org_node_ids)
        && !!selectedNode && memberBody.org_node_ids.join(',') === String(selectedNode.id);

      // 明确加进去的那一个 id，不是"页面自己觉得它在里面"）。
      const newMemberRow = () => [...document.querySelectorAll('.org-member')]

      checks.createMemberShowsNode = (() => {

      })();
      // 未保存的勾选不因新建而丢失，也没有替操作员偷偷写一次成员表。
      checks.createMemberKeptPendingTicks = (() => {

        const box = row && row.querySelector('input[type=checkbox]');

        return !!box && box.checked && puts === putsBeforeCreate;

    checks.createSent = !!created;

    checks.deleteCascadeInUrl = !!del && del.includes('cascade=true');
    checks.deletedNodeGone = !labels(document.getElementById('page')).includes('研发部');
    checks.unrelatedNodeKept = labels(document.getElementById('page')).includes('市场部') || labels(document.getElementById('page')).includes('分公司');

  if (view === 'org-person') {

    await renderOrg({
      page: document.getElementById('page'), actions: document.getElementById('actions'),
      session: { role: 'admin', username: 'admin' }, route: { path: '/org' }, navigate: () => {},
      sidebar: document.getElementById('sidebar-slot'),
    });
    await settle();

    const rows = () => [...document.querySelectorAll('.org-member')];
    checks.personRows = rows().length === window.__org.members[1].length || rows().length > 0;

    checks.dshEnabledBadge = rowText('acme').includes('DSH 已启用');
    checks.dshAdminDisabledBadge = rowText('root-acct').includes('DSH 已停用（管理员）');
    checks.dshLoginUsableBadge = rowText('张三').includes('DSH 登录即可用');
    // 自动启用的前提（账号要有可用模型）必须写在行里，不能只存在于文档。
    checks.dshLoginUsableCaveat = rowText('张三').includes('需该账号有可用模型');

    const multiKeyRow = rows().find((el) => el.textContent.includes('2 / 3 个 Key'));
    checks.multiKeyHint = !!multiKeyRow && multiKeyRow.textContent.includes('登录会先选一把 Key');

    checks.unassignedRow = pageText().includes('未归属账户 4 个');
    const unassigned = [...document.querySelectorAll('.org-unassigned button')].find((b) => b.textContent.includes('未归属账户'));

    checks.unassignedHasNoCheckbox = document.querySelectorAll('.org-members-plain input[type=checkbox]').length === 0;

    const target = rows().find((el) => el.textContent.includes('acme'));

      await settle();
      checks.assignIndependentTick = !!pickBoxOf('研发部') && pickBoxOf('研发部').checked
        && !!pickBoxOf('平台组') && pickBoxOf('平台组').checked === false;
      // 树里的过滤支持拼音（shichang → 市场部），且过滤只是视图：勾选集合不受它影响。
      const pickFilter = pickModal.querySelector('input[type=search]');
      pickFilter.value = 'shichang';
      pickFilter.dispatchEvent(new Event('input'));
      await settle();
      const visibleAfterFilter = treeRowsOf(pickModal).map(labelOfRow);
      checks.assignPinyinFilter = visibleAfterFilter.includes('市场部') && !visibleAfterFilter.includes('研发部');
      pickFilter.value = '';
      pickFilter.dispatchEvent(new Event('input'));
      await settle();
      checks.assignFilterKeepsSelection = !!pickBoxOf('研发部') && pickBoxOf('研发部').checked;
      pickBoxOf('市场部').click();
      await settle();
      [...pickModal.querySelectorAll('button')].find((b) => b.textContent.trim() === '保存').click();
      await settle();
      const assignPatch = (window.__sent || []).filter((call) => call.method === 'PATCH' && call.path === '/accounts/1').pop();
      let assignBody = null;
      try { assignBody = JSON.parse(assignPatch.body); } catch (err) { assignBody = null; }
      checks.assignBodyIsWholeList = !!assignBody && Array.isArray(assignBody.org_node_ids)
        && assignBody.org_node_ids.slice().sort((a, b) => a - b).join(',') === '2,4';
      checks.assignReflectedInRow = (() => {
        const row = rows().find((el) => el.textContent.includes('acme'));
        return !!row && row.textContent.includes('总部/市场部');
      })();
      // 空选的后果必须看得见（保存 = 移出全部组织），而取消不写任何东西。
      const patchesBeforeCancel = (window.__sent || []).filter((call) => call.method === 'PATCH' && call.path === '/accounts/1').length;
      const assignAgain = detailButton('分配组织');
      if (assignAgain) assignAgain.click();
      await settle();
      const pickAgain = document.getElementById('modal-root');
      [...pickAgain.querySelectorAll('button')].find((b) => b.textContent === '清空').click();
      await settle();
      checks.assignEmptyWarns = pickAgain.textContent.includes('未选择任何节点')
        && pickAgain.textContent.includes('标签授权随即失效');
      [...pickAgain.querySelectorAll('button')].find((b) => b.textContent === '取消').click();
      await settle();
      checks.assignCancelWritesNothing = (window.__sent || []).filter((call) => call.method === 'PATCH' && call.path === '/accounts/1').length === patchesBeforeCancel;
    }

    // --- 「收起」必须真的收起来 -------------------------------------------------------------
    //
    // 用户报障：「点击收起不会收起」。当时 app.css 里 .org-person-detail 只有 padding、**没有**
    // 默认隐藏的门控，.org-person.open 只改背景色，于是"收起"只是把 open 类摘掉：DOM 还在、
    // 内容照旧可见。断言必须量几何（rect 高度为 0）而不是查元素是否存在——那个 bug 里元素一直存在。
    const collapse = rowButton('收起');
    checks.collapseLabelAfterExpand = !!collapse;
    if (collapse) collapse.click();
    await settle();
    const hidden = detailOf('1');
    checks.detailCollapseHides = !!hidden && hidden.getBoundingClientRect().height === 0;
    const summaryRow = rows().find((el) => el.textContent.includes('acme'));
    checks.collapseDropsOpenClass = !!summaryRow && !summaryRow.classList.contains('open');
    checks.collapseRestoresLabel = !!rowButton('展开');
    // 再展开一次：内容必须回来（收起不是"把详情删掉"），而且只有一份详情体（刷新时不能自我嵌套）。
    const again = rowButton('展开');
    if (again) again.click();
    await settle();
    const reopened = detailOf('1');
    checks.detailReopens = !!reopened && reopened.getBoundingClientRect().height > 0;
    checks.detailBodySingleAfterReopen = !!reopened
      && reopened.querySelectorAll('.org-person-detail-body').length === 1
      && reopened.querySelectorAll('.org-person-detail').length === 0;

    // 勾选任何一行都会重绘整张表：展开中的那一行必须还在（行对象按账号复用），否则"勾一个人就把
    // 正在看的详情关掉"——这与"收起不生效"是同一类手感问题，只是方向相反。
    const other = rows().find((el) => el.textContent.includes('李四'));
    const otherBox = other && other.querySelector('input[type=checkbox]');
    if (otherBox) otherBox.click();
    await settle();
    const survived = detailOf('1');
    checks.openRowSurvivesRepaint = !!survived && survived.getBoundingClientRect().height > 0 && !!rowButton('收起');
  }

  if (view === 'org-bind') {
    // 绑定飞书人员弹窗：**先弹框、再读通讯录**，读取期间显示进度。
    //
    // 用户报障的形态是"点了绑定飞书之后什么都不发生"：旧实现先 await 目录读、读成功才建弹窗，
    // 所以慢的时候屏幕上没有任何东西。断言必须落在"请求还按在手里"的那一刻——读得快时这个状态
    // 一帧都不存在，只有悬挂响应才看得见。
    await renderOrg({
      page: document.getElementById('page'), actions: document.getElementById('actions'),
      session: { role: 'admin', username: 'admin' }, route: { path: '/org' }, navigate: () => {},
      sidebar: document.getElementById('sidebar-slot'),
    });
    await settle();

    // 用 root-acct（#2）：acme 在夹具里已经绑过飞书，它的按钮是「解绑飞书」——那会弹确认框，
    // 不是选人弹窗（第一版就是点在了解绑上，于是"弹窗没出现"）。
    const rowOfPerson = () => [...document.querySelectorAll('.org-member')].find((el) => el.textContent.includes('root-acct'));
    const detailOf = (id) => document.querySelector('.org-person-detail[data-account-id="' + id + '"]');
    const detailButton = (label) => {
      const row = detailOf('2');
      return row ? [...row.querySelectorAll('button')].find((b) => b.textContent === label) : null;
    };
    // 展开要先等一次 settle（详情是异步填进去的），否则按钮还没出现就去点，整个视图直接抛掉。
    const row = rowOfPerson();
    const rowToggle = row && [...row.querySelectorAll('button')].find((b) => b.textContent === '展开');
    if (rowToggle) rowToggle.click();
    await settle();
    const bindButton = () => detailButton('绑定飞书') || detailButton('解绑飞书');
    checks.bindEntryOffered = !!bindButton();
    const modalText = () => (document.querySelector('#modal-root .feishu-picker-dialog') || {}).textContent || '';
    const pickerButton = (label) => {
      const dialog = document.querySelector('#modal-root .feishu-picker-dialog');
      return dialog ? [...dialog.querySelectorAll('button')].find((b) => b.textContent === label) : null;
    };
    const pickerRows = () => [...document.querySelectorAll('#modal-root .feishu-picker-row')];

    // --- 读得慢的时候：弹窗已经在、进度看得见、绑定点不动、取消随时可用 ----------------------
    window.__holdDirectory = true;
    if (bindButton()) bindButton().click();
    await settle();
    checks.bindDialogOpensBeforeDirectory = !!document.querySelector('#modal-root .feishu-picker-dialog');
    checks.bindShowsProgress = modalText().includes('正在读取飞书通讯录')
      && !!document.querySelector('#modal-root .feishu-picker-dialog .spinner');
    checks.bindExplainsSlowRead = modalText().includes('60 秒内走缓存');
    checks.bindNoRowsWhileLoading = pickerRows().length === 0;
    checks.bindButtonDisabledWhileLoading = !!pickerButton('绑定') && pickerButton('绑定').disabled === true;
    pickerButton('取消').click();
    await settle();
    checks.bindCancelAlwaysWorks = !document.querySelector('#modal-root .feishu-picker-dialog')
      && !!window.__releaseDirectory;

    // --- 放开读：人员列表出来，已绑别人的置灰、已绑本账号的可选 -------------------------------
    window.__releaseDirectory();
    await settle();
    if (bindButton()) bindButton().click();
    await settle();
    checks.bindListRenders = pickerRows().length === 3;
    checks.bindMarksOtherAccount = modalText().includes('已绑定「老板」');
    checks.bindDisablesTakenPerson = (() => {
      const row = pickerRows().find((el) => el.textContent.includes('王五'));
      const box = row && row.querySelector('input[type=radio]');
      return !!box && box.disabled === true;
    })();
    checks.bindMarksOwnAccount = modalText().includes('已绑定本账号');

    // 选一个人绑定：请求体里必须是这个人的 open_id（不是 id 猜测）。
    const liRow = pickerRows().find((el) => el.textContent.includes('李智超'));
    if (liRow) {
      const radio = liRow.querySelector('input[type=radio]');
      radio.checked = true;
      radio.dispatchEvent(new Event('change'));
      await settle();
    }
    pickerButton('绑定').click();
    await settle();
    const bindPut = (window.__sent || []).filter((call) => call.method === 'PUT' && call.path === '/accounts/2/feishu').pop();
    let bindBody = null;
    try { bindBody = JSON.parse(bindPut.body); } catch (err) { bindBody = null; }
    checks.bindSendsChosenPerson = !!bindBody && bindBody.open_id === 'ou_a';
    checks.bindClosesAfterWrite = !document.querySelector('#modal-root .feishu-picker-dialog');

    // --- 「刷新」绕过服务端 60 秒缓存（刚在飞书加的人要能立刻看到） ---------------------------
    if (bindButton()) bindButton().click();
    await settle();
    pickerButton('刷新').click();
    await settle();
    checks.bindRefreshBypassesCache = (window.__calls || [])
      .some((call) => call.includes('/org/feishu/directory') && call.includes('refresh=true'));
    pickerButton('取消').click();
    await settle();

    // --- 读失败：留在弹窗里说明并可重试（不再"点了没反应"） ---------------------------------
    window.__directoryError = '飞书不可达';
    if (bindButton()) bindButton().click();
    await settle();
    checks.bindReadFailureStaysInDialog = !!document.querySelector('#modal-root .feishu-picker-dialog');
    checks.bindReadFailureShowsReason = modalText().includes('飞书不可达');
    checks.bindReadFailureBlocksWrite = !!pickerButton('绑定') && pickerButton('绑定').disabled === true;
    checks.bindReadFailureOffersRefresh = !!pickerButton('刷新');
    pickerButton('取消').click();
    await settle();
    window.__directoryError = null;

    // --- 空通讯录 / 缺数据权限：留在弹窗里说清该改什么 ---------------------------------------
    window.__directoryUsers = [];
    if (bindButton()) bindButton().click();
    await settle();
    checks.bindEmptyDirectoryExplains = modalText().includes('飞书通讯录里没有人员')
      && modalText().includes('权限');
    pickerButton('取消').click();
    await settle();

    window.__directoryUsers = null;
    window.__namesAvailable = false;
    if (bindButton()) bindButton().click();
    await settle();
    checks.bindNamesUnavailableWarnsInDialog = modalText().includes('缺少用户信息权限');
    pickerButton('取消').click();
    await settle();
    window.__namesAvailable = true;
  }

  if (view === 'org-readonly') {
    // A read-only operator gets the same view with every write affordance gone.
    window.__role = 'viewer';
    await renderOrg({
      page: document.getElementById('page'), actions: document.getElementById('actions'),
      session: { role: 'viewer', username: 'reader' }, route: { path: '/org' }, navigate: () => {},
      sidebar: document.getElementById('sidebar-slot'),
    });
    await settle();
    checks.treeRendered = labels(document.getElementById('page')).length > 0;
    checks.noSidebarTree = (document.getElementById('sidebar-slot') || { querySelectorAll: () => [] })
      .querySelectorAll('.tree').length === 0;
    checks.noRowActions = document.querySelectorAll('#page .tree-action').length === 0;
    checks.noCreateRoot = !!find('新建根节点') && find('新建根节点').disabled === true;
    checks.noSaveButton = find('保存成员') === undefined;
    checks.readonlyHintShown = pageText().includes('只读角色不能修改');
    checks.membersVisible = !!document.querySelector('.org-member');
    checks.memberCheckboxDisabled = [...document.querySelectorAll('.org-member input')].every((box) => box.disabled);
    // 只读角色的写入口：新建成员整体不出现（与保存成员同一口径），行内编辑在但点不动。
    checks.noCreateMember = find('新建成员') === undefined;
    checks.rowEditDisabled = (() => {
      const row = document.querySelector('.org-member');
      const edit = row && [...row.querySelectorAll('button')].find((b) => b.textContent === '编辑');
      return !!edit && edit.disabled === true;
    })();
    // 展开一行：四个账号动作都在，但一个都点不动。
    const viewerRow = document.querySelector('.org-member');
    const viewerToggle = viewerRow && [...viewerRow.querySelectorAll('button')].find((b) => b.textContent === '展开');
    if (viewerToggle) viewerToggle.click();
    await settle();
    checks.readonlyDetailActionsDisabled = (() => {
      // 展开的是**第一行**，所以要按它的 account id 取那一行详情：表里每个账号都有一行，
      // 取全页第一个会拿到别人那行（空的）。
      const row = document.querySelector('.org-person-detail[data-account-id="' + viewerRow.dataset.accountId + '"]');
      // 飞书那颗按钮的文案取决于这个账号有没有绑定（绑定/解绑），所以两种都算。
      return ['新建 Key', '启用 DSH', '分配组织'].every((label) => {
        const action = row && [...row.querySelectorAll('button')].find((b) => b.textContent === label);
        return !!action && action.disabled === true;
      }) && ['绑定飞书', '解绑飞书'].some((label) => {
        const action = row && [...row.querySelectorAll('button')].find((b) => b.textContent === label);
        return !!action && action.disabled === true;
      });
    })();
  }

  if (view === 'org-accounts') {
    // The account page's organization column and filter.
    await renderAccounts({
      page: document.getElementById('page'), actions: document.getElementById('actions'),
      session: { role: 'admin', username: 'admin' }, route: { path: '/accounts' }, navigate: () => {},
    });
    await settle();
    checks.orgColumnShown = pageText().includes('所属组织');
    checks.orgPathInCell = pageText().includes('总部/研发部/平台组');
    checks.filterPresent = !!document.querySelector('.org-filter');

    // 筛选行的勾选框同样不能被全局 `input { width:100% }` 撑满，文字要与它同一行对齐。
    const filterBar = document.querySelector('.org-filter-bar');
    const filterBoxEl = filterBar.querySelector('input[type="checkbox"]');
    const filterTextEl = filterBoxEl.parentElement.querySelector('span');
    const fBoxRect = filterBoxEl.getBoundingClientRect();
    const fTextRect = filterTextEl.getBoundingClientRect();
    checks.filterCheckboxNotStretched = fBoxRect.width > 0 && fBoxRect.width <= 20;
    checks.filterCheckboxTextGap = (fTextRect.left - fBoxRect.right) >= 0 && (fTextRect.left - fBoxRect.right) <= 12;
    checks.filterVerticallyAligned = Math.abs((fBoxRect.top + fBoxRect.height / 2) - (fTextRect.top + fTextRect.height / 2)) <= 2;
    checks.filterHasNodes = (() => {
      const select = document.querySelector('.org-filter');
      return !!select && [...select.options].some((o) => o.text === '全部账户') && select.options.length === window.__org.nodes.length + 1;
    })();
    // Selecting a node must reach the server: the raw URL is what proves it.
    const select = document.querySelector('.org-filter');
    select.value = '1';
    select.dispatchEvent(new Event('change'));
    await settle();
    const filtered = (window.__calls || []).find((call) => call.includes('/accounts') && call.includes('org_node_id=1'));
    checks.filterInUrl = !!filtered;
    checks.descendantsDefault = !!filtered && filtered.includes('include_descendants=true');
    const boxes = [...document.querySelectorAll('.org-filter-bar input[type="checkbox"]')];
    if (boxes.length) { boxes[0].checked = false; boxes[0].dispatchEvent(new Event('change')); }
    await settle();
    checks.descendantsCanBeDisabled = (window.__calls || []).some((call) => call.includes('include_descendants=false'));

    // --- 账户页的表单也用同一棵勾选树（不再手填节点 id） --------------------------------------
    const accEditBtn = [...document.querySelectorAll('tbody button')].find((b) => b.textContent.trim() === '编辑');
    checks.accountEditOffered = !!accEditBtn;
    if (accEditBtn) {
      accEditBtn.click();
      await settle();
      const root = document.getElementById('modal-root');
      const editModal = [...root.querySelectorAll('.modal-backdrop')].pop();
      checks.accountEditHasOrgField = editModal.textContent.includes('所属组织');
      checks.accountEditHasNoRawIDs = !editModal.textContent.includes('组织节点 id');
      const openPicker = [...editModal.querySelectorAll('button')].find((b) => b.textContent.includes('分配组织'));
      checks.accountEditOffersPicker = !!openPicker;
      if (openPicker) {
        openPicker.click();
        await settle();
        // 后开的那个 backdrop 才是勾选树（账户编辑弹窗还在下面）。
        const picker = [...document.getElementById('modal-root').querySelectorAll('.modal-backdrop')].pop();
        checks.accountPickerOpens = picker.textContent.includes('已选') && !!picker.querySelector('.org-assign-tree .tree-row');
        const hostBox = [...picker.querySelectorAll('.tree-row')]
          .find((row) => (row.querySelector('.tree-label') || {}).textContent === '总部');
        if (hostBox) hostBox.querySelector('input[type=checkbox]').click();
        await settle();
        [...picker.querySelectorAll('button')].find((b) => b.textContent.trim() === '保存').click();
        await settle();
        // 选完回到表单：这一行用路径显示所选节点，而不是 id。
        const backToForm = [...document.getElementById('modal-root').querySelectorAll('.modal-backdrop')].pop();
        checks.accountOrgFieldShowsPath = backToForm.textContent.includes('总部')
          && backToForm.textContent.includes('总部/研发部/平台组');
        [...backToForm.querySelectorAll('button')].find((b) => b.textContent.trim() === '保存').click();
        await settle();
        const accPatch = (window.__sent || []).filter((call) => call.method === 'PATCH' && call.path === '/accounts/1').pop();
        let accBody = null;
        try { accBody = JSON.parse(accPatch.body); } catch (err) { accBody = null; }
        checks.accountEditSendsPickedNodes = !!accBody && Array.isArray(accBody.org_node_ids)
          && accBody.org_node_ids.slice().sort((a, b) => a - b).join(',') === '1,3';
      }
    }
  }

  const bad = Object.keys(checks).filter((key) => checks[key] === false);
  report({ view, stage: 'done', ok: bad.length === 0, failed: bad, checks, errors, strictChecks: true });
} catch (err) {
  report({ view, stage: 'threw', ok: false, checks, strictChecks: true, thrown: String(err && err.stack ? err.stack : err), errors });
}
</script>
</body>
</html>
