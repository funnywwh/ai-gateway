<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>currency console harness</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="actions" class="toolbar"></div>
<div id="page"></div>
<div id="modal-root"></div>
<script>
// Same shape as providers.page.html: the fixtures answer every management API call,
// so the page under test needs no session and no database.
const FIXTURES = __FIXTURES__;
window.fetch = async (url) => {
  const path = String(url).replace('/admin/api/v1', '').split('?')[0];
  window.__fetched = (window.__fetched || []).concat([path]);
  const body = FIXTURES[path] !== undefined ? FIXTURES[path] : { data: [] };
  return { ok: true, status: 200, text: async () => JSON.stringify(body) };
};
const errors = [];
window.onerror = (msg) => errors.push('onerror: ' + msg);
window.onunhandledrejection = (ev) => errors.push('rejection: ' + ev.reason);

function report(data) {
  data.errors = errors;
  data.toasts = [...document.querySelectorAll('.toast')].map((n) => n.textContent);
  const url = '/report?data=' + encodeURIComponent(JSON.stringify(data));
  try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch (err) { /* fall through */ }
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
  } catch (err) { /* reporting must never break the harness */ }
}
</script>
<script type="module">
import { initCurrency, money, nativeMoney, displayCurrency, setDisplayCurrency, ledgerCurrency, missingRates, currencies } from '/js/money.js';
import { render as renderBilling } from '/js/pages/billing.js';

const view = location.hash.replace('#', '') || 'currency';
const checks = {};
const page = document.getElementById('page');
const pageText = () => page.textContent;
// Microtasks only: headless screenshot mode may tear the page down as soon as it has
// a picture, so nothing here may wait on a timer.
const settle = async () => { for (let i = 0; i < 300; i++) await Promise.resolve(); };

try {
  await initCurrency();
  checks.ledgerCurrency = ledgerCurrency() === 'USD';
  checks.defaultDisplayIsUSD = displayCurrency() === 'USD';
  checks.currencyCount = currencies().length === 2;
  checks.missingRates = missingRates().join(',') === 'EUR';
  checks.nativeAmountsKeepTheirCurrency = nativeMoney(1000000, 'CNY') === '1.000000 CNY';
  checks.ledgerAmountCarriesTheCode = money(500000) === '0.500000 USD';
  checks.noApproxWithoutConversion = !money(500000).includes('≈');

  // The billing page renders ledger amounts through the same helper: with the ledger
  // currency selected the number is exact and unmarked.
  await renderBilling({ page, actions: document.getElementById('actions'), session: { role: 'admin' }, route: { path: '/billing' } });
  await settle();
  checks.pageRendered = pageText().includes('余额');
  checks.pageShowsLedgerAmount = pageText().includes('0.500000 USD');
  checks.pageHasNoApprox = !pageText().includes('≈');

  // Switch the display currency the way the topbar selector does, then re-render:
  // 0.5 USD at 1 CNY = 0.141000 USD is 3.546099... CNY, rounded to nearest.
  setDisplayCurrency('CNY');
  checks.displaySwitched = displayCurrency() === 'CNY';
  checks.convertedRoundsToNearest = money(500000) === '≈3.546099 CNY';
  checks.conversionUsesBigInt = money(141000) === '≈1.000000 CNY';
  // The page is re-rendered the way the topbar selector does it: the router clears
  // the page container first, so the previous render must not linger.
  page.replaceChildren();
  document.getElementById('actions').replaceChildren();
  await renderBilling({ page, actions: document.getElementById('actions'), session: { role: 'admin' }, route: { path: '/billing' } });
  await settle();
  checks.pageShowsApprox = pageText().includes('≈3.546099 CNY');
  checks.pageKeepsLedgerCurrencyOutOfTheNumbers = !pageText().includes('0.500000 USD');

  // Switching back must reproduce the exact amount, not the converted one.
  setDisplayCurrency('USD');
  checks.backToExact = money(500000) === '0.500000 USD';

  report({ view, stage: 'done', ok: Object.values(checks).every((value) => value === true), checks });
} catch (err) {
  report({ view, stage: 'threw', ok: false, checks, thrown: String(err && err.stack ? err.stack : err) });
}
</script>
</body>
</html>
