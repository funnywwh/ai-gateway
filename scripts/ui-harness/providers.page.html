<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>providers console harness</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="actions" class="toolbar"></div>
<div id="page"></div>
<div id="modal-root"></div>
<script>
// The fixtures are captured from a live gateway (see README): the stub answers every
// management API call, so the page under test never needs a session or a network.
const FIXTURES = __FIXTURES__;
window.fetch = async (url) => {
  const path = String(url).replace(/^.*\/admin\/api\/v1/, '').split('?')[0];
  window.__fetched = (window.__fetched || []).concat([path]);
  if (path === '/providers/2/test') window.__handshakeDone = true;
  let body = FIXTURES[path] !== undefined ? FIXTURES[path] : { data: [] };
  if (path === '/providers/2' && window.__handshakeDone) body = FIXTURES['/providers/2-after'];
  // A fixture of null stands for a 200 with an empty body, which api.js parses to null.
  if (body === null) return { ok: true, status: 200, text: async () => '' };
  return { ok: true, status: 200, text: async () => JSON.stringify(body) };
};
const errors = [];
window.onerror = (msg) => errors.push('onerror: ' + msg);
window.onunhandledrejection = (ev) => errors.push('rejection: ' + ev.reason);

// report() pushes one result to the runner. Two constraints learned the hard way:
//   * headless screenshot mode tears the page down as soon as it has a picture, so a
//     report must not wait on a timer — the whole flow stays on microtasks;
//   * sendBeacon survives that teardown where a synchronous XHR does not.
function report(data) {
  data.errors = errors;
  data.toasts = [...document.querySelectorAll('.toast')].map((n) => n.textContent);
  const url = '/report?data=' + encodeURIComponent(JSON.stringify(data));
  try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch (err) { /* fall through */ }
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
  } catch (err) { /* reporting must never break the harness */ }
}
</script>
<script type="module">
import { render } from '/js/pages/providers.js';

const view = location.hash.replace('#', '') || 'docs';
const checks = {};
const modal = () => document.getElementById('modal-root');
const modalText = () => modal().textContent;
const pageText = () => document.getElementById('page').textContent;
const find = (label) => [...document.querySelectorAll('button')].find((b) => b.textContent.trim() === label);
const rowFor = (needle) => [...document.querySelectorAll('tbody tr')].find((tr) => tr.textContent.includes(needle));
const rows = () => modal().querySelectorAll('tbody tr').length;
const rowTexts = () => [...modal().querySelectorAll('tbody tr')].map((tr) => tr.textContent.trim().slice(0, 40));
// closeButton is the round ✕ every dialog must carry in its top-right corner.
const closeButton = () => modal().querySelector('.modal-head .modal-close');
// The ✕ must sit on the dialog's frame, not inside the scrolling region: the header
// is a direct child of .modal while content goes in .modal-body. This shrinks the
// dialog (CSSOM, so CSP does not apply) until its body genuinely overflows, scrolls
// every container that will scroll, and then checks the ✕ has not moved and is still
// inside the dialog's visible frame. It scrolls the dialog as well as the body on
// purpose: before the fix .modal itself was the scroller, so the ✕ rode up out of the
// frame with the content — a body-only scroll test would have missed exactly that.
const pinnedChecks = () => {
  const btn = closeButton();
  const dialog = modal().querySelector('.modal');
  const body = dialog && dialog.querySelector('.modal-body');
  if (!btn || !body) return { closeOnFrame: false };
  const restore = dialog.style.maxHeight;
  dialog.style.maxHeight = '160px';
  const before = btn.getBoundingClientRect();
  const dialogBox = dialog.getBoundingClientRect();
  const bodyOverflows = body.scrollHeight > body.clientHeight;
  body.scrollTop = body.scrollHeight;
  dialog.scrollTop = dialog.scrollHeight;
  const after = btn.getBoundingClientRect();
  const frame = dialog.getBoundingClientRect();
  const result = {
    // The furniture lives outside the element that scrolls.
    closeOnFrame: !body.contains(btn) && !body.contains(dialog.firstElementChild),
    // Something must really have scrolled, or the positional checks prove nothing.
    bodyScrollable: bodyOverflows && body.scrollTop > 0,
    // The dialog itself must not be a scroll container at all.
    dialogNotScrollable: dialog.scrollTop === 0,
    // Measured: after scrolling content to the bottom, the ✕ has not moved…
    closeStaysPutAfterScroll: Math.abs(after.top - before.top) < 0.5 && Math.abs(after.right - before.right) < 0.5,
    // …and it is still fully inside the dialog's frame, not scrolled out of view.
    closeVisibleInFrame: after.top >= frame.top - 0.5 && after.bottom <= frame.bottom + 0.5
      && after.left >= frame.left - 0.5 && after.right <= frame.right + 0.5,
  };
  body.scrollTop = 0;
  dialog.scrollTop = 0;
  dialog.style.maxHeight = restore;
  return result;
};
// The affordance is checked as rendered, not as class names: a round hit target,
// inside the header, sitting to the right of the title.
const closeChecks = () => {
  const btn = closeButton();
  if (!btn) return { closeButton: false };
  const head = btn.closest('.modal-head');
  const title = head && head.querySelector('h3');
  const dialog = btn.closest('.modal');
  const radius = parseFloat(getComputedStyle(btn).borderTopLeftRadius) || 0;
  const size = btn.getBoundingClientRect();
  return {
    closeButton: true,
    closeRound: radius >= size.width / 2 - 1 && radius >= size.height / 2 - 1,
    closeInHeader: !!head && dialog && dialog.firstElementChild === head,
    closeRightOfTitle: !!title && title.getBoundingClientRect().right <= btn.getBoundingClientRect().left,
    closeLabel: btn.getAttribute('aria-label') === '关闭',
    ...pinnedChecks(),
  };
};
// Microtasks only: a timer would hand control back to the browser, which may close the
// page before every check has reported (see the note above report()).
const settle = async () => { for (let i = 0; i < 300; i++) await Promise.resolve(); };

try {
  await render({ page: document.getElementById('page'), actions: document.getElementById('actions'), session: { role: 'admin' } });
  await settle();
  checks.tableRendered = pageText().includes('deepseek') && pageText().includes('openai-chat');

  if (view === 'docs') {
    find('内建类型说明').click();
    await settle();
    const t = modalText();
    checks.dialogOpen = modal().querySelectorAll('.modal').length === 1;
    Object.assign(checks, closeChecks());
    checks.noteShown = t.includes('对接 OpenAI 兼容的 /chat/completions');
    checks.configTable = t.includes('配置字段（config）');
    checks.credentialsTable = t.includes('凭据字段（credentials');
    checks.template = t.includes('配置模板');
    checks.createFromTemplate = !!find('用此模板新建');
    checks.deepseekFields = ['base_url', 'api_key', 'models[]', 'thinking.mode', 'thinking.style',
      'thinking.replay_reasoning_content', 'response_format', 'default_max_output_tokens'].every((f) => t.includes(f));
    checks.credentialMarks = t.includes('密钥') && t.includes('建议填「凭据」栏');
    checks.requiredMark = t.includes('必填');
    checks.allKindsListed = ['openai-chat', 'openai-responses', 'testecho'].every((k) => t.includes(k));
    checks.fieldRows = rows();
    checks.sample = rowTexts().slice(0, 4);
  }

  if (view === 'detail') {
    const row = rowFor('openai-chat');
    [...row.querySelectorAll('button')].find((b) => b.textContent.trim() === '详情').click();
    await settle();
    const t = modalText();
    checks.dialogOpen = modal().querySelectorAll('.modal').length === 1;
    Object.assign(checks, closeChecks());
    // The ✕ must actually dismiss: clicking it removes the whole backdrop, not just
    // the button, so the console is never left with an invisible click blocker.
    closeButton().click();
    await settle();
    checks.closeDismisses = modal().querySelectorAll('.modal, .modal-backdrop').length === 0;
    [...row.querySelectorAll('button')].find((b) => b.textContent.trim() === '详情').click();
    await settle();
    checks.reopenedAfterClose = modal().querySelectorAll('.modal').length === 1;
    checks.detailSection = t.includes('配置说明');
    checks.detailFields = ['default_max_output_tokens', 'thinking.replay_reasoning_content', 'models[]'].every((f) => t.includes(f));
    checks.detailCredentialHint = t.includes('建议填「凭据」栏');
    checks.detailTemplate = t.includes('配置模板');
    checks.fieldRows = rows();
    checks.sample = rowTexts().slice(0, 4);
  }

  if (view === 'create') {
    find('内建类型说明').click();
    await settle();
    const templateBtn = find('用此模板新建');
    checks.createFromTemplate = !!templateBtn;
    if (templateBtn) templateBtn.click();
    await settle();
    const config = document.querySelector('textarea[name="config"]');
    const kind = document.querySelector('input[name="kind"]');
    checks.prefilledKind = !!kind && kind.value === 'openai-chat';
    checks.prefilledTemplate = !!config && config.value.includes('api.deepseek.com');
    checks.credentialsField = !!document.querySelector('textarea[name="credentials"]');
    checks.kindHint = modalText().includes('内建：openai-chat');
  }

  // A plugin whose instance carries no recorded handshake yet: the detail page must
  // explain that instead of starting the process, and the button must read it once.
  if (view === 'plugin') {
    const row = rowFor('plugin:codex');
    [...row.querySelectorAll('button')].find((b) => b.textContent.trim() === '详情').click();
    await settle();
    const before = modalText();
    checks.pluginPrompt = before.includes('由插件在握手时声明');
    Object.assign(checks, closeChecks());
    const read = find('读取插件声明（会启动/连接该插件进程）');
    checks.readButton = !!read;
    if (read) { read.click(); await settle(); }
    const t = modalText();
    checks.pluginTableShown = t.includes('配置字段（config）');
    checks.pluginFieldsAfterHandshake = ['health_model', 'session_cookie', 'proxy'].every((f) => t.includes(f));
    checks.fieldRows = rows();
    checks.sample = rowTexts().slice(0, 4);
  }

  // A plugin whose handshake is already recorded: the table renders immediately.
  if (view === 'plugin-cached') {
    const row = rowFor('plugin:replay');
    [...row.querySelectorAll('button')].find((b) => b.textContent.trim() === '详情').click();
    await settle();
    const t = modalText();
    checks.pluginPrompt = t.includes('由插件在握手时声明');
    Object.assign(checks, closeChecks());
    checks.pluginTableShown = t.includes('配置字段（config）');
    checks.pluginFieldsAfterHandshake = ['reply', 'chunks', 'delay_ms', 'api_key'].every((f) => t.includes(f));
    checks.fieldRows = rows();
    checks.sample = rowTexts().slice(0, 4);
  }

  // The model-mapping section (M28). It exists because a model plus a route without this
  // third row is excluded by the router as "not_mapped" and then vanishes from
  // /v1/models without an error — the console used to have no surface for it at all.
  if (view === 'models') {
    const row = rowFor('replay-local');
    [...row.querySelectorAll('button')].find((b) => b.textContent.trim() === '详情').click();
    await settle();
    const t = modalText();
    checks.dialogOpen = modal().querySelectorAll('.modal').length === 1;
    checks.sectionShown = t.includes('模型映射');
    checks.addButton = !!find('新增模型映射');
    // Every mapping is listed, with its declared capabilities and whether cost rules exist.
    checks.mappingRows = rows();
    checks.listedMappings = ['replay', 'replay-slow', 'replay-retired'].every((m) => t.includes(m));
    checks.capabilityBadges = t.includes('stream') && t.includes('未声明');
    checks.costRuleColumn = t.includes('成本规则') && t.includes('有') && t.includes('无');
    checks.disabledShown = t.includes('off');
    // The route without a mapping must be named, with the reason the data plane gives.
    checks.orphanWarning = t.includes('条路由缺映射') && t.includes('ghost-model') && t.includes('not_mapped');
    checks.rowActions = [...modal().querySelectorAll('tbody button')].map((b) => b.textContent.trim());
    checks.rowActionsPresent = checks.rowActions.includes('编辑') && checks.rowActions.includes('删除');
    checks.sample = rowTexts().slice(0, 4);

    // The create form must carry every field the mapping is made of.
    const add = find('新增模型映射');
    if (add) { add.click(); await settle(); }
    const form = modalText();
    checks.formFields = ['对客模型名', '上游模型名', '能力（JSON）', '能力校验', '成本规则（JSON）']
      .every((f) => form.includes(f));
    checks.formHints = form.includes('保持原值');
    checks.publicModelField = !!document.querySelector('input[name="public_model"]');
    checks.capabilitiesField = !!document.querySelector('textarea[name="capabilities"]');
  }

  const flags = Object.entries(checks).filter(([, v]) => typeof v === 'boolean');
  const numeric = Object.entries(checks).filter(([, v]) => typeof v === 'number');
  report({ view, stage: 'done', checks, fetched: window.__fetched,
    ok: errors.length === 0 && flags.every(([, v]) => v === true) && numeric.every(([, v]) => v > 0) });
} catch (err) {
  report({ view, stage: 'threw', checks, thrown: String(err && err.stack ? err.stack : err), fetched: window.__fetched });
}
</script>
</body>
</html>
