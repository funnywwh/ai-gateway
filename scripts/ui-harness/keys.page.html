<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>keys console harness</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="actions" class="toolbar"></div>
<div id="page"></div>
<div id="modal-root"></div>
<!-- toast() appends into #toasts, which the console shell provides; without it the key
     editor's "已更新" would be a null dereference instead of a visible confirmation. -->
<div id="toasts" class="toasts"></div>
<script>
// Same shape as providers.page.html: fixtures answer every management API call, so the
// pages under test need no session and no database. Unlike that page this one also
// records request bodies, because the key editor's job is to *send* the right policy.
const FIXTURES = __FIXTURES__;

// 45 synthetic workspace buckets (M31). The captured breakdowns hold fewer buckets than one
// page, and a pager can only be exercised against more than one page. The three sort keys
// are made to disagree on their first bucket on purpose: if 最近一次, 请求数 and 成本 all
// led with the same bucket, a broken sort switch would still pass every assertion.
function syntheticWorkspaces() {
  const rows = [];
  const base = Date.parse('2026-09-11T12:00:00Z');
  for (let i = 1; i <= 45; i++) {
    rows.push({
      key: '/w/' + String(i).padStart(3, '0'),
      // 请求数 grows with the index while 最近一次 runs the other way, so those two orders
      // are exact reverses of each other; 成本 peaks at /w/023 instead.
      requests: i, metered: i,
      first_seen: new Date(base - 90 * 60000).toISOString(),
      last_seen: new Date(base - (i - 1) * 60000).toISOString(),
      input_tokens: 100 * i, output_tokens: i, reasoning_tokens: 0,
      cost_micros: 10 * i, charge_micros: 1000 * (45 - Math.abs(i - 23)),
    });
  }
  return rows;
}

// dimensionRows answers a grouping with the captured fixture when there is one (the
// credential groupings are the ones whose *names* the view has to render, and one shared
// fixture could not describe them) and with the synthetic workspaces otherwise.
function dimensionRows(groupBy) {
  const key = '/requests/dimensions?group_by=' + groupBy;
  if (FIXTURES[key] !== undefined) return FIXTURES[key].rows || [];
  if (groupBy === 'workspace') return syntheticWorkspaces();
  return (FIXTURES['/requests/dimensions'] || {}).rows || [];
}

// sortDimensions applies the endpoint's ordering: three descending keys, each with the
// group key as its tiebreaker. The paged breakdown has to be *served* ordered and sliced —
// a stub that ignored limit/offset/sort would make the console's pager and sort switch
// unobservable, because both only ever send a query string.
function sortDimensions(rows, sort) {
  const value = (row) => {
    if (sort === 'requests') return Number(row.requests || 0);
    if (sort === 'charge') return Number(row.charge_micros || 0);
    return Date.parse(row.last_seen || '') || 0;
  };
  return rows.slice().sort((a, b) => (value(b) - value(a)) || String(a.key).localeCompare(String(b.key)));
}

window.fetch = async (url, options) => {
  const target = String(url);
  const path = target.replace('/admin/api/v1', '').split('?')[0];
  window.__fetched = (window.__fetched || []).concat([path]);
  // The raw URL, query string included: whether a filter value actually reaches the server
  // is the part the console can get wrong while still rendering a plausible table.
  window.__urls = (window.__urls || []).concat([target]);
  if (options && options.body) {
    window.__sent = window.__sent || {};
    window.__sent[path] = options.body;
  }
  // __detailOverride answers one request-log id with an empty body — a 200 whose payload
  // api.js parses to null — and lists it as a second row so the page can be asked for that
  // detail. Without it the fixtures only ever describe a readable row, which is how the
  // requests page shipped with an unguarded dereference of that null.
  if (window.__detailOverride && path === '/requests/' + window.__detailOverride) {
    return { ok: true, status: 200, text: async () => '' };
  }
  if (window.__detailOverride && path === '/requests') {
    const list = FIXTURES['/requests'];
    const row = { ...list.data[0], request_id: window.__detailOverride };
    return { ok: true, status: 200, text: async () => JSON.stringify({ ...list, count: 2, total: 2, data: list.data.concat([row]), has_more: false }) };
  }
  const query = new URLSearchParams(target.split('?')[1] || '');
  if (path === '/requests/dimensions') {
    const all = dimensionRows(query.get('group_by'));
    const limit = Number(query.get('limit') || 20);
    const offset = Number(query.get('offset') || 0);
    const rows = sortDimensions(all, query.get('sort')).slice(offset, offset + limit);
    return {
      ok: true, status: 200,
      text: async () => JSON.stringify({
        group_by: query.get('group_by'), sort: query.get('sort') || 'last_seen',
        limit, offset, count: rows.length, total: all.length,
        has_more: offset + rows.length < all.length, rows,
      }),
    };
  }
  const body = FIXTURES[path] !== undefined ? FIXTURES[path] : { data: [] };
  // A fixture of null stands for an empty body: api.js parses that to null, not to {}.
  if (body === null) return { ok: true, status: 200, text: async () => '' };
  return { ok: true, status: 200, text: async () => JSON.stringify(body) };
};
const errors = [];
window.onerror = (msg) => errors.push('onerror: ' + msg);
window.onunhandledrejection = (ev) => errors.push('rejection: ' + ev.reason);

function report(data) {
  data.errors = errors;
  data.toasts = [...document.querySelectorAll('.toast')].map((n) => n.textContent);
  const url = '/report?data=' + encodeURIComponent(JSON.stringify(data));
  try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch (err) { /* fall through */ }
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
  } catch (err) { /* reporting must never break the harness */ }
}
</script>
<script type="module">
import { render as renderKeys } from '/js/pages/keys.js';
import { render as renderRequests } from '/js/pages/requests.js';
// Imported for their import graph and module-level code: without node there is no other
// syntax check for the console, and these two pages share the same helpers.
import '/js/pages/tags.js';
import '/js/pages/settings.js';

const view = location.hash.replace('#', '') || 'keys';
const checks = {};
const modal = () => document.getElementById('modal-root');
const modalText = () => modal().textContent;
const pageText = () => document.getElementById('page').textContent;
const find = (label) => [...document.querySelectorAll('button')].find((b) => b.textContent.trim() === label);
const settle = async () => { for (let i = 0; i < 300; i++) await Promise.resolve(); };
// groupBySelected drives the request log's statistics card: the grouping select is the one
// offering the call-kind dimension, which no other select on the page has.
const groupBySelected = (value) => {
  const select = [...document.querySelectorAll('select')]
    .find((s) => [...s.options].some((o) => o.value === 'call_kind'));
  if (!select) return false;
  select.value = value;
  select.dispatchEvent(new Event('change'));
  return true;
};
const closeButton = () => modal().querySelector('.modal-head .modal-close');
const closeChecks = () => {
  const btn = closeButton();
  if (!btn) return { closeButton: false };
  return { closeButton: true, closeLabel: btn.getAttribute('aria-label') === '关闭' };
};

try {
  if (view === 'keys') {
    await renderKeys({ page: document.getElementById('page'), actions: document.getElementById('actions'), session: { role: 'admin' } });
    await settle();
    checks.tableRendered = pageText().includes('dev-key');
    checks.quotaColumn = pageText().includes('配额');
    checks.quotaShown = pageText().includes('"rpm":60');
    checks.recordingHint = pageText().includes('默认只记录用户输入');

    [...document.querySelectorAll('tbody button')].find((b) => b.textContent.trim() === '编辑').click();
    await settle();
    checks.dialogOpen = modal().querySelectorAll('.modal').length === 1;
    Object.assign(checks, closeChecks());

    const select = modal().querySelector('select[name="record_input_mode"]');
    checks.modeSelect = !!select;
    // The console and the server must agree on the accepted values: "meta" used to be
    // offered while the backend only understood "metadata", so the choice vanished.
    checks.modeValues = !!select && [...select.options].map((o) => o.value).join(',') === 'inherit,user,full,metadata,off';

    const policy = modal().querySelector('textarea[name="policy"]');
    checks.policyField = !!policy;
    checks.policyPrefilled = !!policy && policy.value.includes('"rpm": 60');
    checks.policyHint = modalText().includes('扁平');
    checks.fieldRows = modal().querySelectorAll('label.field').length;

    find('保存').click();
    await settle();
    const sent = (window.__sent || {})['/keys/1'];
    checks.patchSent = !!sent;
    let body = null;
    try { body = JSON.parse(sent); } catch (err) { body = null; }
    checks.policyInPatch = !!body && !!body.policy && body.policy.rpm === 60 && body.policy.concurrency === 4;
    checks.modeInPatch = !!body && body.record_input_mode === 'user';
    checks.toastShown = [...document.querySelectorAll('.toast')].some((n) => n.textContent.includes('已更新'));
  }

  if (view === 'requests') {
    await renderRequests({ page: document.getElementById('page'), actions: document.getElementById('actions'), session: { role: 'admin' } });
    await settle();
    checks.tableRendered = pageText().includes('req_demo0001');
    checks.recordingHint = pageText().includes('独立于正文口径记录的元数据');
    checks.columns = ['输出文本', '客户端', '模型', '工作区', '会话', '类型', '标题', '成本'].every((c) => pageText().includes(c));
    // The identity filters are the point of the page now: a client select, a model select
    // filled from the statistics endpoint, and free-text session/workspace boxes.
    checks.clientFilter = [...document.querySelectorAll('select')].some((s) => [...s.options].some((o) => o.value === 'codex'));
    checks.modelFilter = [...document.querySelectorAll('select')].some((s) => [...s.options].some((o) => o.value === 'deepseek-flash'));
    checks.sessionFilter = !!document.querySelector('input[placeholder^="会话 id"]');
    // Identity columns render what was recorded, and the alias case shows both names.
    checks.clientShown = pageText().includes('dsh') && pageText().includes('codex');
    checks.aliasShown = pageText().includes('gpt-5.6-luna') && pageText().includes('← luna');
    checks.titleShown = pageText().includes('从 dsh 和 codex 请求解析 workspace');
    // Tokens come from the metering table; a request with no usage row says so instead of
    // reporting a zero that would read as "it consumed nothing".
    checks.tokensShown = pageText().includes('1,200 / 34');
    checks.unmeteredShown = pageText().includes('未计量');
    checks.costShown = pageText().includes('≈') || pageText().includes('USD') || pageText().includes('CNY');
    checks.costFetched = (window.__fetched || []).includes('/requests/dimensions');
    // The summary row under the list sums the page's two consumption columns. It is the
    // page, not the window: the fixtures hold one metered row (1,200 / 34, charge 2,468
    // micros) and one unmetered row, so the totals are that row's numbers and the label
    // has to say which rows were left out.
    const foot = document.querySelector('tfoot');
    const footText = () => (document.querySelector('tfoot') || {}).textContent || '';
    checks.summaryRow = !!foot && foot.querySelectorAll('tr').length === 1;
    checks.summaryLabel = footText().includes('本页汇总') && footText().includes('共 2 行')
      && footText().includes('已计量 1') && footText().includes('未计量 1');
    checks.summaryTokens = footText().includes('1,200 / 34');
    checks.summaryCost = footText().includes('0.002468 USD');
    // A summary that dropped or shifted a cell would still "show numbers": the alignment
    // is the part that silently rots when a column is added. The header is read from the
    // footer's own table — the page also carries the 维度统计 card's table.
    checks.summaryAligned = !!foot
      && foot.querySelector('tr').children.length === foot.closest('table').querySelectorAll('thead th').length;
    // The filter box in the table's toolbar sifts this page in the browser, so the summary
    // has to follow what is left on screen: "codex" leaves the unmetered fixture row, and
    // a page with nothing left shows no summary row at all (instead of 0 / 0).
    const typeFilter = (value) => {
      const box = document.querySelector('input[type=search]');
      box.value = value;
      box.dispatchEvent(new Event('input'));
    };
    typeFilter('codex');
    checks.summaryFollowsFilter = footText().includes('共 1 行') && footText().includes('已计量 0')
      && footText().includes('未计量 1') && !footText().includes('1,200');
    typeFilter('zzz-no-such-row');
    checks.summaryHiddenWhenEmpty = !document.querySelector('tfoot tr') && pageText().includes('该窗口内没有请求日志');
    typeFilter('');
    await settle();
    checks.summaryRestored = footText().includes('共 2 行') && footText().includes('1,200 / 34');
    // The dimension card groups by an identity dimension and sums consumption per group.
    // Its default grouping is 用户（账户）(M30), which is the question this page is opened
    // with; the metered-vs-requests gap it explains is asserted on the model grouping,
    // whose fixture carries one (luna: 1 of 2).
    checks.dimensionCard = pageText().includes('维度统计');
    checks.dimensionDefaultGrouping = pageText().includes('acme #1') && pageText().includes('（未知）');
    groupBySelected('model');
    await settle();
    checks.dimensionRows = pageText().includes('deepseek-flash') && pageText().includes('已计量');
    checks.dimensionMeteredGap = pageText().includes('1 / 2');
    // The fetch stub strips the query string, so the grouping change is observed by the
    // card asking the endpoint again rather than by reading the URL back.
    const dimensionFetches = () => (window.__fetched || []).filter((p) => p === '/requests/dimensions').length;
    const beforeRegroup = dimensionFetches();
    groupBySelected('session');
    await settle();
    checks.dimensionRegrouped = dimensionFetches() > beforeRegroup;

    // 用户（账户）与 API Key 是凭据维度（M30）：列、筛选下拉与统计分组都按它们成立。
    const headers = () => [...document.querySelectorAll('thead th')].map((th) => th.textContent);
    checks.ownerColumns = ['用户', 'API Key'].every((c) => headers().includes(c));
    // 名字要出现在**行**里（下拉选项里也有 'dev-key'，只查页面文本会被它蒙过去）。
    const ownerRow = [...document.querySelectorAll('tbody tr')].find((tr) => tr.textContent.includes('req_demo0001'));
    checks.ownerNamesShown = !!ownerRow && ownerRow.textContent.includes('acme') && ownerRow.textContent.includes('dev-key');
    const selectByOptionText = (text) => [...document.querySelectorAll('select')].find((s) => [...s.options].some((o) => o.textContent === text));
    const accountSelect = selectByOptionText('全部用户');
    const keySelect = selectByOptionText('全部 API Key');
    checks.accountFilter = !!accountSelect && [...accountSelect.options].some((o) => o.textContent === 'acme');
    checks.keyFilter = !!keySelect && [...keySelect.options].some((o) => o.textContent.includes('dev-key'));
    // 筛选是服务端的：切账户会带 account_id 取列表、按该账户重取 Key 列表；切 Key 会带
    // api_key_id 取列表。只断言「控件存在」会漏掉「值没发出去」这类错误，所以读原始 URL。
    const urlsSince = (mark) => (window.__urls || []).slice(mark);
    const accountMark = (window.__urls || []).length;
    accountSelect.value = '1';
    accountSelect.dispatchEvent(new Event('change'));
    await settle();
    checks.filterSendsAccountId = urlsSince(accountMark).some((u) => u.includes('account_id=1'));
    checks.keyListFollowsAccount = urlsSince(accountMark).some((u) => u.includes('/keys?') && u.includes('account_id=1'));
    const keyMark = (window.__urls || []).length;
    keySelect.value = '1';
    keySelect.dispatchEvent(new Event('change'));
    await settle();
    checks.filterSendsKeyId = urlsSince(keyMark).some((u) => u.includes('api_key_id=1'));
    // 统计卡的两个新分组按 id 分组、按名字显示；id 为 0 的历史行归入「（未知）」桶。
    groupBySelected('account');
    await settle();
    checks.dimensionAccountNames = pageText().includes('acme #1');
    checks.dimensionUnknownBucket = pageText().includes('（未知）');
    // 留一份可读证据在 make ui-check 的输出里（sample 由 runner 打印）。
    const accountBuckets = ([...document.querySelectorAll('table')].pop() || {}).textContent || '';
    groupBySelected('api_key');
    await settle();
    checks.dimensionKeyNames = pageText().includes('dev-key #1');
    const apiKeyBuckets = ([...document.querySelectorAll('table')].pop() || {}).textContent || '';
    const accountMark2 = (window.__urls || []).length;
    accountSelect.value = '';
    accountSelect.dispatchEvent(new Event('change'));
    await settle();
    checks.clearingAccountDropsId = !urlsSince(accountMark2).some((u) => u.includes('account_id='));

    // ---- M31：统计卡置顶 + 排序下拉 + 分组分页 ----
    // 卡片顺序按 **DOM** 读：统计卡必须在列表卡之前（按文本出现顺序断言会被页面任意位置的
    // 文字蒙过去）。
    const cards = [...document.querySelectorAll('#page > .card')];
    checks.statsCardAboveList = cards.length === 2
      && cards[0].textContent.includes('维度统计') && cards[1].textContent.includes('req_demo0001');
    const statsCard = cards[0];
    const statsPager = () => statsCard.querySelector('.pager');
    const statsFirstRow = () => {
      const first = statsCard.querySelector('tbody tr');
      return first ? first.textContent : '';
    };
    const statsHeaders = () => [...statsCard.querySelectorAll('thead th')].map((th) => th.textContent);
    // 改造没有动列表的分页器：它仍然说「共 N 条」，与统计卡的「共 N 个分组」区分开——
    // 页面上同时有两个分页器，各自的单位就是各自口径的第一句话。
    checks.listPagerUnchanged = pageText().includes('共 2 条') && !pageText().includes('共 2 个分组');

    // 45 个合成工作区分组：默认排序是「最近一次」，第 1 页装 001–020，共 3 页。
    groupBySelected('workspace');
    await settle();
    checks.statsPagerShown = !!statsPager()
      && statsPager().textContent.includes('共 45 个分组')
      && statsPager().textContent.includes('本页 1–20')
      && statsPager().textContent.includes('第 1/3 页');
    checks.statsSortedByTime = statsFirstRow().includes('/w/001');
    // 排序依据必须在屏幕上：「最近一次」列存在、当前排序列带 ↓、值是时间。
    checks.statsTimeColumn = statsHeaders().includes('最近一次 ↓');
    checks.statsTimeShown = statsFirstRow().includes('2026');
    // 下一页：请求带 offset=20，第 2 页装 021–040（分页器在统计卡内部，不能读到列表那个）。
    const statsMark = (window.__urls || []).length;
    const nextButton = [...statsPager().querySelectorAll('button')].find((b) => b.textContent.trim() === '下一页');
    checks.statsNextButton = !!nextButton;
    if (nextButton) nextButton.click();
    await settle();
    checks.statsNextSendsOffset = urlsSince(statsMark)
      .some((u) => u.includes('/requests/dimensions?') && u.includes('offset=20'));
    checks.statsSecondPage = statsFirstRow().includes('/w/021') && statsPager().textContent.includes('本页 21–40');
    // 「刷新」重读当前页：offset 与排序键都保持（旧 offset 不属于别的行集就不会被归零）。
    const refreshMark = (window.__urls || []).length;
    find('刷新').click();
    await settle();
    checks.statsRefreshKeepsPage = urlsSince(refreshMark)
      .some((u) => u.includes('/requests/dimensions?') && u.includes('offset=20'));
    // 切换排序键：带 sort= 重取、offset 归零、首桶换成最忙的那个、↓ 跟着移动。
    const sortSelect = [...document.querySelectorAll('select')].find((s) => [...s.options].some((o) => o.value === 'charge'));
    checks.sortSelectShown = !!sortSelect;
    const sortMark = (window.__urls || []).length;
    sortSelect.value = 'requests';
    sortSelect.dispatchEvent(new Event('change'));
    await settle();
    checks.sortSendsKey = urlsSince(sortMark).some((u) => u.includes('sort=requests') && u.includes('offset=0'));
    checks.sortedByRequests = statsFirstRow().includes('/w/045') && statsHeaders().includes('请求数 ↓');
    sortSelect.value = 'charge';
    sortSelect.dispatchEvent(new Event('change'));
    await settle();
    checks.sortedByCharge = statsFirstRow().includes('/w/023') && statsHeaders().includes('成本 ↓');
    // 切筛选把统计窗口也归零（老 offset 属于另一套行集），并保留排序键。
    const clientSelect = [...document.querySelectorAll('select')].find((s) => [...s.options].some((o) => o.value === 'unknown'));
    const filterMark = (window.__urls || []).length;
    clientSelect.value = 'dsh';
    clientSelect.dispatchEvent(new Event('change'));
    await settle();
    checks.statsFilterResetsOffset = urlsSince(filterMark)
      .some((u) => u.includes('/requests/dimensions?') && u.includes('offset=0') && u.includes('sort=charge'));

    // The retention policy is reported from /stats: the window, what this process has
    // already pruned, and whether any write had to fall back to a skeleton row.
    checks.retentionWindow = pageText().includes('保留期 30 天');
    checks.prunedSoFar = pageText().includes('本进程已清理 12 行');
    checks.fallbackReported = pageText().includes('写入失败 1 次');
    checks.pruneButton = !!find('清理过期日志');

    // Manual prune: the confirmation must name the window it will cut at, and the result
    // must come back as a toast with the counts.
    find('清理过期日志').click();
    await settle();
    checks.pruneConfirms = modalText().includes('保留期 30 天之前的请求日志');
    find('确认').click();
    await settle();
    checks.pruneSent = !!(window.__sent || {})['/requests/prune'];
    checks.pruneToast = [...document.querySelectorAll('.toast')].some((n) => n.textContent.includes('已删除请求日志 12 行'));
    checks.pruneStayedOnPage = pageText().includes('req_demo0001');

    find('详情').click();
    await settle();
    checks.dialogOpen = modal().querySelectorAll('.modal').length === 1;
    Object.assign(checks, closeChecks());
    const t = modalText();
    // The size of a request is recorded even when its content is not, so a "未录制"
    // panel can still say how big the request was.
    checks.bytesShown = t.includes('请求正文 483 字节');
    checks.inputPanel = t.includes('ping from m23');
    checks.omittedTally = t.includes('omitted');
    // The detail carries the identity and the metered consumption alongside the content.
    checks.detailIdentity = t.includes('客户端：') && t.includes('会话：') && t.includes('路由到的模型：');
    // 凭据维度在详情里带名字与 id：名字给人读，id 是筛选参数。
    checks.detailOwner = t.includes('用户（账户）：') && t.includes('API Key：') && t.includes('acme #1') && t.includes('dev-key #1');
    checks.detailUsage = t.includes('输入 tokens：') && t.includes('对客：');
    closeButton().click();
    await settle();
    checks.closeDismisses = modal().querySelectorAll('.modal, .modal-backdrop').length === 0;

    // A detail whose body is empty parses to null. That used to throw a TypeError inside
    // the click handler and leave the operator with an empty screen and a console stack,
    // so the page must report it on screen and stay usable. The window is reloaded first:
    // the row whose detail is empty is a separate fixture row.
    window.__detailOverride = 'req_pruned0002';
    const spent = errors.length;
    find('刷新').click();
    await settle();
    const prunedRow = [...document.querySelectorAll('tbody tr')].find((tr) => tr.textContent.includes('req_pruned0002'));
    checks.nullBodyRowListed = !!prunedRow;
    // The reload brought a third row (a second metered one, same numbers as the first),
    // so the summary has to have followed the list rather than kept its first numbers.
    checks.summaryFollowsRefresh = footText().includes('2,400 / 68') && footText().includes('已计量 2');
    checks.sample = [footText(), '账户分组：' + accountBuckets, 'API Key 分组：' + apiKeyBuckets,
      '统计分页器：' + (statsPager() ? statsPager().textContent : '（无）'), '统计首行：' + statsFirstRow().slice(0, 70)];
    if (prunedRow) [...prunedRow.querySelectorAll('button')].find((b) => b.textContent.trim() === '详情').click();
    await settle();
    checks.clickWithoutRejection = errors.length === spent;
    checks.emptyDetailExplained = [...document.querySelectorAll('.toast')].some((n) => n.textContent.includes('详情为空'));
    checks.noDialogOnEmpty = modal().querySelectorAll('.modal').length === 0;
    window.__detailOverride = null;
  }

  const flags = Object.entries(checks).filter(([, v]) => typeof v === 'boolean');
  const numeric = Object.entries(checks).filter(([, v]) => typeof v === 'number');
  report({ view, stage: 'done', checks, fetched: window.__fetched,
    ok: errors.length === 0 && flags.every(([, v]) => v === true) && numeric.every(([, v]) => v > 0) });
} catch (err) {
  report({ view, stage: 'threw', checks, thrown: String(err && err.stack ? err.stack : err), fetched: window.__fetched });
}
</script>
</body>
</html>
