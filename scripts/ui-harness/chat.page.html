<script>
// 智能问答 / 技能库 harness.
//
// Two things here cannot be taken from a captured fixture:
//
//   * the answer stream. The chat page consumes SSE through api.js streamPost, so the stub
//     answers POST …/turns with a real ReadableStream of frames — that is the only way to
//     exercise the delta folding (text/reasoning/tool_call/tool_result/notice/message/done)
//     without a model;
//   * the preview round trip, which has to show that the page posts the exact bytes it is
//     about to preview and then frames the returned ticket.
//
// Everything else is a small synthetic fixture, because these endpoints are new in M32 and a
// captured snapshot would only restate what the page already sends.
const FIXTURES = __FIXTURES__;

const MCP_TOKENS = [
  { id: 2, name: 'dsh', token_prefix: 'aigw_mcp_qad', scope: 'admin_read', status: 'active' },
  { id: 3, name: 'operator', token_prefix: 'aigw_mcp_zzz', scope: 'admin', status: 'active' },
  { id: 4, name: 'retired', token_prefix: 'aigw_mcp_old', scope: 'admin', status: 'revoked' },
];

const SESSION = {
  id: 'chat_1', object: 'chat.session', title: '本月成本', model: 'deepseek-flash',
  account_id: 1, api_key_id: 1, mcp_token_id: 2, write_mode: 'read_only', skill_ids: [7],
  message_count: 2, status: 'active', tokens_in: 1200, tokens_out: 240, tokens_reasoning: 0,
  owner: 'admin', created_at: '2026-09-12T08:00:00Z', updated_at: '2026-09-12T08:05:00Z',
  skills: [{ id: 7, name: '成本排查', description: '按账户核对成本与收费', instructions: '先查账户，再查用量。', chars: 12 }],
  messages: [
    {
      id: 'cmsg_u1', session_id: 'chat_1', turn_id: 'turn_1', seq: 1, role: 'user',
      content: '这个月哪个模型最贵？', parts: [{ type: 'text', text: '这个月哪个模型最贵？' }],
      status: 'ok', request_ids: [], created_at: '2026-09-12T08:00:00Z',
    },
    {
      id: 'cmsg_a1', session_id: 'chat_1', turn_id: 'turn_1', seq: 2, role: 'assistant',
      content: '结论…', status: 'ok', truncated: false, error: '', model: 'deepseek-flash',
      resolved_model: 'deepseek-flash', provider: 'testecho',
      request_ids: ['req_demo0001'], tokens_in: 1200, tokens_out: 240, tokens_reasoning: 0,
      cost_micros: 1200, charge_micros: 2400, created_at: '2026-09-12T08:00:05Z',
      reasoning: '先看看请求日志，再按模型分组。',
      parts: [
        {
          type: 'text',
          text: '## 结论\n\n最贵的是 **deepseek-flash**，本月成本见下表。\n\n| 模型 | 成本 |\n| --- | --- |\n| deepseek-flash | 1.20 |\n| luna | 0.40 |\n',
        },
        {
          type: 'tool_call', id: 'call_1', name: 'admin_request',
          arguments: '{"name":"admin_request_dimensions","query":{"group_by":"model"}}',
          result: '{"count":2,"rows":[{"key":"deepseek-flash"}]}', is_error: false, status: 'done',
        },
        {
          type: 'text',
          text: '```chart\n' + JSON.stringify({
            type: 'bar', title: '本月成本', y_label: '成本', unit: 'USD',
            categories: ['flash', 'luna'], series: [{ name: '成本', values: [1.2, 0.4] }],
            source: { tool: 'admin_request', request_id: 'req_demo0001', note: '本月 1 日至今天' },
          }) + '\n```\n\n```chart\n{"type":"bar","categories":["a"]}\n```\n\n' +
            '```html\n<!doctype html><html><body><h1>hi</h1><script>document.title="x"<\/script></body></html>\n```\n',
        },
      ],
    },
  ],
  tool_calls: [{ id: 'tcall_1', call_id: 'call_1', step: 1, name: 'admin_request', status: 'done', is_error: false, duration_ms: 12, created_at: '2026-09-12T08:00:03Z' }],
};

const SKILLS = {
  data: [{
    id: 7, name: '成本排查', description: '按账户核对成本与收费',
    instructions: '先查账户，再查用量，最后核对收费。', chars: 18, source_session_id: 'chat_1',
    source_model: 'deepseek-flash', created_at: '2026-09-11T08:00:00Z', updated_at: '2026-09-12T08:00:00Z',
  }],
  total: 1, count: 1, limit: 20, offset: 0, has_more: false,
};

// Turn frames: the shape the server emits, including the two terminal events. When
// window.__uiReply is set the answer also carries a `ui` directive and a new page version,
// which is how the reply path (apply in place, offer the new version) is exercised.
function turnFrames(turnID) {
  const frames = [
    { type: 'turn', turn_id: turnID },
    { type: 'step', step: 1, model: 'deepseek-flash' },
    { type: 'text', delta: '让我先查一下' },
    { type: 'reasoning', delta: '按模型分组' },
    { type: 'tool_call', call_id: 'call_9', tool: { call_id: 'call_9', name: 'admin_request' } },
    { type: 'tool_call', call_id: 'call_9', delta: '{"name":"admin_list_requests"}' },
    { type: 'tool_result', call_id: 'call_9', tool: { call_id: 'call_9', name: 'admin_request', result: '{"count":2}', is_error: false, status: 'done', duration_ms: 8 } },
    { type: 'usage', step: 1, usage: { input_tokens: 100, output_tokens: 20, reasoning_tokens: 0, metered: true }, request_id: 'req_stream01' },
    { type: 'notice', level: 'info', notice: '流式回答已就绪' },
    { type: 'message', message: SESSION.messages[1] },
    { type: 'done', status: 'completed' },
  ];
  if (window.__uiReply) {
    frames.splice(2, 0, { type: 'text', delta: '\n\n```ui\n{"ops":[{"op":"text","target":"#result","value":"ok"}]}\n```' });
  }
  return frames.map((frame) => 'event: ' + frame.type + '\ndata: ' + JSON.stringify(frame) + '\n\n').join('');
}

// sseStream builds a response whose frames are pushed from outside, so a test can hold a turn
// open and exercise what happens while the model is still answering (the submission queue, the
// delta relay). window.__stream.frame(...) pushes, window.__stream.finish() closes.
function sseStream() {
  const encoder = new TextEncoder();
  let controller = null;
  const stream = new ReadableStream({ start(c) { controller = c; } });
  const api = {
    frame(obj) { controller.enqueue(encoder.encode('event: ' + obj.type + '\ndata: ' + JSON.stringify(obj) + '\n\n')); },
    finish() { try { controller.close(); } catch (err) { /* already closed */ } },
  };
  window.__stream = api;
  return {
    ok: true, status: 200,
    headers: { get: (key) => (String(key).toLowerCase() === 'content-type' ? 'text/event-stream' : null) },
    body: stream,
    text: async () => '',
  };
}

function sseResponse(body) {
  const encoder = new TextEncoder();
  const stream = new ReadableStream({
    start(controller) {
      controller.enqueue(encoder.encode(body));
      controller.close();
    },
  });
  return {
    ok: true, status: 200,
    headers: { get: (key) => (String(key).toLowerCase() === 'content-type' ? 'text/event-stream' : null) },
    body: stream,
    text: async () => body,
  };
}

window.fetch = async (url, options) => {
  const target = String(url);
  const path = target.replace('/admin/api/v1', '').split('?')[0];
  const query = new URLSearchParams(target.split('?')[1] || '');
  window.__fetched = (window.__fetched || []).concat([path]);
  window.__urls = (window.__urls || []).concat([target]);
  if (options && options.body) {
    window.__sent = window.__sent || {};
    window.__sent[path] = options.body;
  }
  if (path === '/chat/sessions/chat_1/turns') {
    const body = JSON.parse((options && options.body) || '{}');
    if (window.__holdTurn) return sseStream();
    return sseResponse(turnFrames(body.turn_id));
  }
  if (path === '/chat/sessions/chat_1/artifacts') {
    // Echo the bridge flag the way the server does: the console decides whether the frame is
    // interactive from what it asked for, and the harness must not be able to hide a
    // regression by always answering "true".
    const sent = JSON.parse((options && options.body) || '{}');
    return json({
      id: 'art_1', url: '/admin/chat-artifact/art_1', ticket: 'tkt_demo',
      expires_at: '2026-09-12T08:10:00Z', bridge: !!sent.bridge,
    });
  }
  if (path === '/chat/sessions/chat_1' && options && options.method === 'PATCH') {
    // Answer like the real server: re-derive write_mode from the newly bound token's scope
    // instead of echoing the old value. A stub that echoed would let "rebind to an admin
    // token" pass while the badge still said 只读.
    const body = JSON.parse(options.body || '{}');
    const bound = MCP_TOKENS.find((t) => t.id === body.mcp_token_id);
    return json({
      ...SESSION,
      mcp_token_id: body.mcp_token_id === undefined ? SESSION.mcp_token_id : body.mcp_token_id,
      write_mode: bound && bound.scope === 'admin' ? 'allow_writes' : 'read_only',
    });
  }
  if (path === '/chat/sessions/chat_1') return json(SESSION);
  if (path === '/chat/sessions' && options && options.method === 'POST') return json(SESSION);
  if (path === '/chat/sessions') return json({ object: 'list', data: [SESSION], total: 1, limit: 30, offset: 0, count: 1 });
  if (path === '/chat/skills' && options && (options.method === 'POST' || options.method === 'PATCH')) {
    return json(SKILLS.data[0]);
  }
  if (path === '/chat/skills') {
    if (window.__skillsEmpty) return json({ object: 'list', data: [], total: 0, limit: 20, offset: 0, count: 0 });
    return json(SKILLS);
  }
  if (path === '/chat/models') return json({ object: 'list', account: 'acme', data: [{ id: 'deepseek-flash', has_tools: true }] });
  if (path === '/accounts') return json({ data: [{ id: 1, name: 'acme', billing_mode: 'postpaid' }], total: 1, count: 1, limit: 200, offset: 0 });
  if (path === '/keys') return json({ data: [{ id: 1, name: 'console-chat', key_prefix: 'sk-gw-abc', status: 'active' }], total: 1, count: 1, limit: 200, offset: 0 });
  // The new-session dialog lists the tokens a conversation may act as.
  if (path === '/mcp-tokens') return json({ data: MCP_TOKENS, total: MCP_TOKENS.length, count: MCP_TOKENS.length, limit: 200, offset: 0 });
  if (path === '/chat/sessions/chat_1/skill-draft') {
    return json({ name: '成本核对', description: '每月核对成本', instructions: '查账户→查用量', note: '', request_id: 'req_draft01', model: 'deepseek-flash' });
  }
  if (FIXTURES[path] !== undefined) return json(FIXTURES[path]);
  return json({ data: [] });
};

function json(body) {
  return { ok: true, status: 200, headers: { get: () => 'application/json' }, text: async () => JSON.stringify(body) };
}

// Console-side helpers for the interactive preview (M34).
//
// There used to be a stub here that faked `frame.contentDocument` and handed the console a token
// out of it. That stub was the reason a real bug shipped: a sandboxed document is an opaque
// origin, so `contentDocument` is null in a browser, and every interactive preview reported
// "不可交互". The console now generates the token itself and puts it in the frame's URL, so the
// harness only has to read the same URL the browser would load — no stub, nothing faked.
function previewFrameToken() {
  const frame = document.querySelector('.preview-frame');
  if (!frame) return '';
  const match = /(?:[?&])aigw_token=([^&]+)/.exec(frame.getAttribute('src') || '');
  return match ? decodeURIComponent(match[1]) : '';
}

// openInteractivePreview clicks the preview button and returns the frame the console built.
async function openInteractivePreview() {
  const button = find('预览（可交互）') || find('预览');
  if (!button) return null;
  button.click();
  await settle();
  return document.querySelector('.preview-frame');
}

// handOverPort plays the frame's side of the handshake and returns a port the harness can use
// to drive (and observe) the channel.
async function handOverPort(frame, { token = null, withPort = true } = {}) {
  if (token === null) token = previewFrameToken();
  const channel = new MessageChannel();
  const seen = [];
  channel.port1.onmessage = (ev) => seen.push(ev.data);
  channel.port1.start();
  frame.contentWindow.dispatchEvent(new MessageEvent('message', {
    data: { aigw: 'ui', t: 'hello', token },
    source: frame.contentWindow,
    ports: withPort ? [channel.port2] : [],
  }));
  await settle();
  return { seen, port: channel.port1 };
}

// formEvent is one submission as the injected script sends it.
function formEvent(port, { name = 'submit', label = '目标设备信息', data = { region: 'cn-north-1' } } = {}) {
  port.postMessage({ t: 'ev', name, label, v: JSON.stringify(data) });
}

const errors = [];
window.onerror = (msg) => errors.push('onerror: ' + msg);
window.onunhandledrejection = (ev) => errors.push('rejection: ' + ev.reason);

function report(data) {
  data.errors = errors;
  data.toasts = [...document.querySelectorAll('.toast')].map((n) => n.textContent);
  const url = '/report?data=' + encodeURIComponent(JSON.stringify(data));
  try { if (navigator.sendBeacon && navigator.sendBeacon(url)) return; } catch (err) { /* fall through */ }
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, false);
    xhr.send();
  } catch (err) { /* reporting must never break the harness */ }
}
</script>
<script type="module">
import { render as renderChat, uiEventContent, codeBlocksOf } from '/js/pages/chat.js';
import { render as renderSkills } from '/js/pages/skills.js';
import { parseChart } from '/js/chart.js';
import { renderMarkdown, safeHref } from '/js/markdown.js';
import { parseUISpec, applyUIOps, UI_LIMITS } from '/js/pages/chat_ui.js';
import { uiReplyParts } from '/js/pages/chat_artifact.js';

const view = location.hash.replace('#', '') || 'chat';
const checks = {};
const pageEl = document.getElementById('page');
const pageText = () => pageEl.textContent;
const find = (label) => [...document.querySelectorAll('button')].find((b) => b.textContent.trim() === label);
const settle = async () => { for (let i = 0; i < 400; i++) await Promise.resolve(); };

try {
  if (view === 'chat') {
   try {
    // The pure helpers first: they carry the security-relevant rules, and a broken one would
    // otherwise only show up as an odd-looking answer.
    checks.mdHeading = renderMarkdown('## 标题').querySelector('.md-heading') !== null;
    checks.mdTable = renderMarkdown('| a | b |\n| --- | --- |\n| 1 | 2 |').querySelectorAll('.md-table td').length === 2;
    checks.mdCodeLang = renderMarkdown('```chart\n{}\n```').querySelector('code').getAttribute('data-lang') === 'chart';
    checks.mdLinkScheme = safeHref('javascript:alert(1)') === null && safeHref('https://example.com') !== null;
    checks.mdNoInnerHTML = renderMarkdown('<img src=x onerror=alert(1)>').querySelector('img') === null;

    checks.chartValid = parseChart(JSON.stringify({ type: 'bar', categories: ['a'], series: [{ name: 's', values: [1] }] })).spec !== undefined;
    checks.chartRejectsBadJSON = !!parseChart('not json').error;
    checks.chartRejectsMismatch = !!parseChart(JSON.stringify({ type: 'bar', categories: ['a', 'b'], series: [{ values: [1] }] })).error;
    checks.chartRejectsTooMany = !!parseChart(JSON.stringify({
      type: 'line', categories: ['a'],
      series: Array.from({ length: 9 }, (_, i) => ({ name: 's' + i, values: [i] })),
    })).error;
    checks.chartRejectsNegativePie = !!parseChart(JSON.stringify({
      type: 'pie', categories: ['a', 'b'], series: [{ name: 's', values: [1, -1] }],
    })).error;
    checks.chartRejectsEmpty = !!parseChart(JSON.stringify({
      type: 'bar', categories: ['a'], series: [{ name: 's', values: [null] }],
    })).error;

    const destroy = await renderChat({
      page: pageEl,
      actions: document.getElementById('actions'),
      session: { role: 'admin', username: 'admin' },
      route: { path: '/chat', params: new URLSearchParams('session=chat_1') },
      navigate: () => {},
    });
    await settle();

    checks.deepLinkFetched = (window.__fetched || []).includes('/chat/sessions/chat_1');
    checks.sessionTitle = pageText().includes('本月成本');
    checks.messageRendered = pageText().includes('最贵的是');
    checks.markdownHeadingInAnswer = !!pageEl.querySelector('.chat-text .md-heading');
    checks.markdownTableInAnswer = !!pageEl.querySelector('.chat-text .md-table');
    checks.reasoningCollapsed = !!pageEl.querySelector('.chat-reasoning');
    checks.toolCard = !!pageEl.querySelector('.chat-tool-name')
      && pageEl.querySelector('.chat-tool-name').textContent === 'admin_request';
    checks.toolResultShown = pageText().includes('admin_request_dimensions');
    checks.usageFooter = pageText().includes('tokens 1200→240') || pageText().includes('收费');
    checks.skillChip = [...pageEl.querySelectorAll('.chip')].some((n) => n.textContent.includes('成本排查'));

    // The token badge is the control for a conversation's authority. It must show the bound
    // token, and rebinding must PATCH mcp_token_id — that is the only way to bring an older
    // conversation back to life (or move it to a narrower scope) without abandoning the
    // skills it has loaded.
    const tokenBadge = pageEl.querySelector('.chat-header .badge-button');
    checks.tokenBadgeShown = !!tokenBadge && tokenBadge.textContent.includes('MCP 令牌 #2');
    if (tokenBadge) {
      tokenBadge.click();
      await settle();
      const picker = document.querySelector('.modal-body select');
      checks.rebindModalOpens = !!document.querySelector('.modal');

      checks.rebindPickerOffersUsableTokens = !!picker && picker.options.length === 2
        && ![...picker.options].some((o) => o.textContent.includes('retired'));
      checks.rebindPickerPreselectsCurrent = !!picker && picker.value === '2';
      if (picker) {
        // Switch to the admin-scope token and check the selection sticks. Refilling the options
        // from the change handler would reset the select and snap back to the first option,
        // which is exactly the bug operators reported as "I cannot choose anything"
        // (see commit d240287) — so this assertion is the regression guard for it.
        picker.value = '3';
        picker.dispatchEvent(new Event('change'));
        await settle();
        checks.rebindSelectionSticks = picker.value === '3'
          && [...picker.options].filter((o) => o.selected).map((o) => o.value).join() === '3';
        // The dialog is appended to #modal-root, outside pageEl, so read it directly.
        const lastModal = [...document.querySelectorAll('.modal')].pop();
        checks.rebindHintUpdates = !!lastModal
          && lastModal.textContent.includes('可执行全部控制台操作（含发凭据、动账、删除）');
        const confirmBtn = [...document.querySelectorAll('.modal-actions button')]
          .find((b) => b.textContent.trim() === '改绑');
        checks.rebindConfirmPresent = !!confirmBtn;
        if (confirmBtn) {
          confirmBtn.click();
          await settle();
          const sent = JSON.parse((window.__sent || {})['/chat/sessions/chat_1'] || '{}');
          checks.rebindPatched = sent.mcp_token_id === 3;
          checks.rebindSingleField = Object.keys(sent).length === 1;
        }
      }
    }

    // The chart is drawn locally as SVG; its data table and source note are what let a
    // person check the numbers the model drew.
    const chart = pageEl.querySelector('.chart');
    checks.chartRendered = !!chart && chart.querySelectorAll('svg rect').length >= 2;
    checks.chartAxis = !!chart && !!chart.querySelector('.chart-axis');
    checks.chartDataTable = !!chart && !!chart.querySelector('.chart-data');
    checks.chartSource = !!chart && (chart.querySelector('.chart-source').textContent || '').includes('admin_request');
    checks.chartTools = !!find('CSV') && !!find('SVG');
    checks.chartFallback = pageText().includes('图表未渲染');

    // HTML code blocks get a preview button (the model's page never touches this DOM). A
    // billed conversation gets the interactive one, and the upload has to say so: the server
    // mints the interactive ticket from that flag, and without it the page has no way back.
    const preview = find('预览（可交互）') || find('预览');
    checks.previewButton = !!preview;
    checks.previewButtonSaysInteractive = !!find('预览（可交互）');
    if (preview) {
      preview.click();
      await settle();
      const frame = document.querySelector('.preview-frame');
      checks.previewFrame = !!frame;
      checks.previewSandbox = !!frame && frame.getAttribute('sandbox') === 'allow-scripts';
      checks.previewSrc = !!frame && (frame.getAttribute('src') || '').includes('/admin/chat-artifact/art_1?ticket=');
      checks.previewSrcAsksForBridge = !!frame && (frame.getAttribute('src') || '').includes('bridge=1');
      const sent = JSON.parse((window.__sent || {})['/chat/sessions/chat_1/artifacts'] || '{}');
      checks.previewUploadedBody = typeof sent.body === 'string' && sent.body.includes('<h1>hi</h1>');
      checks.previewFormat = sent.format === 'html';
      checks.previewUploadSaysBridge = sent.bridge === true;
      // The handshake token must be in the frame's URL: that is where the injected script reads
      // it, and it is the only place another document cannot look. It must also be the token the
      // upload carried, because the console keeps that copy to check the handshake against.
      checks.previewUrlCarriesToken = /(?:[?&])aigw_token=[0-9a-f]{16,}/.test(frame.getAttribute('src') || '');
      checks.previewUploadSaysToken = typeof sent.bridge_token === 'string' && sent.bridge_token.length >= 16;
      checks.previewTokenMatchesUrl = !!sent.bridge_token
        && previewFrameToken() === sent.bridge_token;
      const close = [...document.querySelectorAll('.modal-actions button')].find((b) => b.textContent.trim() === '关闭');
      if (close) close.click();
      await settle();
    }

    // ---- the interactive preview (M34) -------------------------------------
    // The directive the model writes back is applied as element construction, never as markup,
    // and every operation it cannot honour is reported instead of ignored.
    const uiSpec = parseUISpec('{"ops":[{"op":"text","target":"#r","value":"hi"}]}');
    checks.uiSpecParses = uiSpec.error === '' && uiSpec.ops.length === 1;
    checks.uiSpecAcceptsBareArray = parseUISpec('[{"op":"hide","target":"#r"}]').ops.length === 1;
    checks.uiSpecRejectsBadJSON = !!parseUISpec('nope').error;
    checks.uiSpecRejectsShape = !!parseUISpec('{"foo":1}').error;
    checks.uiSpecRejectsEmpty = !!parseUISpec('{"ops":[]}').error;
    checks.uiSpecCapsOps = !!parseUISpec(JSON.stringify({
      ops: Array.from({ length: 70 }, () => ({ op: 'hide', target: '#r' })),
    })).error;

    const uiRoot = document.createElement('div');
    const mk = (tag, attrs) => {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, value);
      return node;
    };
    const select = mk('select', { id: 's' });
    select.append(mk('option', { value: 'a' }), mk('option', { value: 'b' }));
    select.firstChild.textContent = 'a';
    select.lastChild.textContent = 'b';
    const resultNode = mk('div', { id: 'result' });
    resultNode.textContent = '旧值';
    const msgNode = mk('div', { id: 'msg' });
    const svgNode = mk('div', { id: 'draw' });
    const box = mk('div', { id: 'r' });
    const span = mk('span', { class: 'a' });
    span.textContent = '1';
    box.append(span);
    uiRoot.append(box, mk('input', { id: 'f', value: 'old' }), select, resultNode, msgNode, svgNode);
    // Attached to the live document on purpose: a detached tree has no CSSOM (inline styles are
    // dropped) and cannot host SVG geometry, so a detached fixture would report failures that
    // the real console never has.
    document.body.append(uiRoot);
    let uiApplied;
    try {
      // Order matters inside one directive, exactly as it does in the model's intent: `hide .a`
      // is applied before `text #r` replaces that node's children, so both effects are visible
      // in the result. (Written the other way round, the hide silently matches nothing — which
      // is what the first version of this test did.)
      uiApplied = applyUIOps([
      { op: 'set', target: '#f', value: 'new' },
      { op: 'set', target: '#s', value: ['b'] },
      { op: 'class', target: '#r', add: ['on'], remove: ['off'] },
      { op: 'hide', target: '.a' },
      { op: 'message', target: '#msg', value: '提示', level: 'ok' },
      { op: 'text', target: '#result', value: 'hello' },
      ], { root: uiRoot });
    } catch (err) {
      // Capture everything: a thrown string, an Error, or a DOMException all have to be
      // readable in the report, otherwise the only way to debug this is to re-run by hand.
      uiApplied = {
        applied: [], errors: [],
        threw: String(err) + ' | message=' + (err && err.message) + ' | stack=' +
          (err && err.stack ? String(err.stack).split('\n').slice(0, 3).join(' <- ') : 'none'),
      };
    }
    checks.uiApplyNoErrors = uiApplied.errors.length === 0;
    checks.uiApplyThrew = uiApplied.threw || '';
    checks.uiApplyFirstError = uiApplied.errors[0] || '';
    checks.uiApplyText = uiRoot.querySelector('#result').textContent === 'hello';
    checks.uiApplyKeepsUntouchedNode = uiRoot.querySelector('#r').textContent.includes('1');
    checks.uiApplyInput = uiRoot.querySelector('#f').value === 'new';
    checks.uiApplySelect = uiRoot.querySelector('#s').value === 'b';
    checks.uiApplyClass = uiRoot.querySelector('#r').classList.contains('on');
    checks.uiApplyHidden = uiRoot.querySelector('.a').style.display === 'none';
    checks.uiApplyMessage = !!uiRoot.querySelector('.aigw-msg');
    let uiBad;
    try {
      uiBad = applyUIOps([
        { op: 'html', target: '#r', value: '<img src=x onerror=alert(1)>' },
        { op: 'text', target: '#missing', value: 'x' },
        { op: 'text', value: 'no target' },
      ], { root: uiRoot });
    } catch (err) {
      checks.uiBadThrew = String(err && err.message ? err.message : err);
      uiBad = { applied: [], errors: [] };
    }
    checks.uiApplyRejectsUnknown = uiBad.errors.length === 3 && uiBad.applied.length === 0;
    checks.uiApplyNoMarkup = uiRoot.querySelector('img') === null;
    // A vector patch is built element by element, and an event-handler attribute is not in the
    // allow-list — the node is created, the handler attribute is not.
    let svgErrors = [];
    try {
      svgErrors = applyUIOps([{
        op: 'svg', target: '#draw',
        svg: { tag: 'svg', attrs: { onload: 'alert(1)', viewBox: '0 0 10 10' }, children: [{ tag: 'circle', attrs: { cx: '5', cy: '5', r: '4' } }] },
      }], { root: uiRoot }).errors;
    } catch (err) {
      checks.uiSvgThrew = String(err && err.message ? err.message : err);
    }
    checks.uiSvgNoErrors = svgErrors.length === 0;
    const uisvg = uiRoot.querySelector('#draw svg');
    checks.uiSvgBuilt = !!uisvg && !!uisvg.querySelector('circle');
    checks.uiSvgKeepsAllowedAttrs = !!uisvg && uisvg.getAttribute('viewBox') === '0 0 10 10';
    checks.uiSvgRejectsScriptAttr = !!uisvg && uisvg.getAttribute('onload') === null;

    // The submission the model receives: a readable line (which also becomes the session title)
    // plus the structured event, marked as coming from the interface rather than typed.
    const uiContent = uiEventContent({ name: 'submit', label: '目标设备信息', data: { region: 'cn' } });
    checks.uiEventHeadline = uiContent.split('\n')[0] === '目标设备信息';
    checks.uiEventMarker = uiContent.includes('"source":"ui_event"') && uiContent.includes('"region":"cn"');
    checks.uiEventJSONParses = (() => {
      const match = /```json\n([\s\S]*?)\n```/.exec(uiContent);
      if (!match) return false;
      try { return JSON.parse(match[1]).event === 'submit'; } catch (err) { return false; }
    })();
    // The reply path reads the directive and the new page version out of the answer's blocks.
    const replyMessage = {
      parts: [{
        type: 'text',
        text: [
          '说明', '',
          '```ui', '{"ops":[{"op":"text","target":"#result","value":"x"}]}', '```', '',
          '```html', '<h1>new</h1>', '```', '',
        ].join('\n'),
      }],
    };
    checks.uiBlocksFound = codeBlocksOf(replyMessage).length === 2;
    const replyParts = uiReplyParts(codeBlocksOf(replyMessage));
    checks.uiReplyFindsOps = replyParts.error === '' && replyParts.ops.length === 1 && replyParts.ops[0].op === 'text';
    checks.uiReplyReportsBadSpec = (() => {
      const bad = uiReplyParts([{ lang: 'ui', text: 'not json' }]);
      return bad.ops.length === 0 && !!bad.error;
    })();
    checks.uiReplyFindsNewVersion = replyParts.newVersion === '<h1>new</h1>';

    // ---- the live channel ------------------------------------------------
    // Drives the console's half of the bridge the way the injected script does: hello from the
    // frame, a MessagePort, then events.
    const uiFrame = await openInteractivePreview();
    checks.uiFrameOpens = !!uiFrame;
    checks.uiBadgeWaitsForHandshake = !!document.querySelector('.bridge-badge')
      && document.querySelector('.bridge-badge').textContent.includes('等待页面握手');

    // A hello is only accepted from this frame, with this frame's token, and it must carry a
    // port. Everything else is ignored — that matrix is the whole reason the channel is a port
    // rather than a message listener.
    if (uiFrame) {
      const before = document.querySelector('.bridge-badge').textContent;
      const realToken = previewFrameToken();
      checks.previewTokenAvailable = !!realToken;
      uiFrame.contentWindow.dispatchEvent(new MessageEvent('message', {
        data: { aigw: 'ui', t: 'hello', token: 'not-the-token' }, source: uiFrame.contentWindow,
        ports: [new MessageChannel().port2],
      }));
      uiFrame.contentWindow.dispatchEvent(new MessageEvent('message', {
        data: { aigw: 'ui', t: 'hello', token: realToken }, source: window,
        ports: [new MessageChannel().port2],
      }));
      uiFrame.contentWindow.dispatchEvent(new MessageEvent('message', {
        data: { aigw: 'ui', t: 'hello', token: realToken }, source: uiFrame.contentWindow, ports: [],
      }));
      uiFrame.contentWindow.dispatchEvent(new MessageEvent('message', {
        data: { aigw: 'ui', t: 'port', token: realToken }, source: uiFrame.contentWindow,
        ports: [new MessageChannel().port2],
      }));
      await settle();
      checks.uiHandshakeRejectsBadGreetings =
        document.querySelector('.bridge-badge').textContent === before;
      checks.uiHandshakeAccepted = (() => {
        const live = document.querySelector('.modal .bridge-badge');
        return !!live && live.textContent.includes('已连接');
      })();
    }

    if (uiFrame) {
      const channel = await handOverPort(uiFrame);
      checks.uiPortAccepted = document.querySelector('.modal .bridge-badge').textContent.includes('已连接');

      // A submission becomes a normal question: the request body has to be the ui_event payload,
      // and it must be billed like anything else typed into the composer.
      const turnsBefore = (window.__fetched || []).filter((p) => p === '/chat/sessions/chat_1/turns').length;
      formEvent(channel.port, { name: 'submit', label: '目标设备信息', data: { region: 'cn-north-1', tier: 'pro' } });
      await settle();
      const uiTurn = JSON.parse((window.__sent || {})['/chat/sessions/chat_1/turns'] || '{}');
      checks.uiSubmitSentTurn = (window.__fetched || []).filter((p) => p === '/chat/sessions/chat_1/turns').length === turnsBefore + 1;
      checks.uiSubmitContentHead = uiTurn.content.startsWith('目标设备信息');
      checks.uiSubmitContentMarker = (uiTurn.content || '').includes('"source":"ui_event"') &&
        (uiTurn.content || '').includes('"region":"cn-north-1"');
      checks.uiSubmitHasTurnId = typeof uiTurn.turn_id === 'string' && uiTurn.turn_id.length > 0;
      checks.uiCounter = document.querySelector('.bridge-counter').textContent.includes('已提交 1/');

      // The request id the console sends for a submission is the same shape as a typed one, so
      // the request log cannot tell them apart — which is the point: same billing path.
      checks.uiTurnIdShape = /^turn_/.test(uiTurn.turn_id || '');

      // Two submissions inside the minimum interval: the second is refused with a reason, not
      // silently dropped, and it does not cost anything. Both are queued while the first turn is
      // still open — that is the same code path, and the limits must not be bypassed by it.
      const turnsAfterFirst = (window.__fetched || []).filter((p) => p === '/chat/sessions/chat_1/turns').length;
      window.__holdTurn = true;
      formEvent(channel.port, { name: 'submit', label: '排队中的提交', data: { region: 'queued' } });
      await settle();
      checks.uiQueueNotice = document.querySelector('.chat-notice').textContent.includes('已排队');
      formEvent(channel.port, { name: 'submit', data: { region: 'again' } });
      await settle();
      checks.uiQueueCap = document.querySelector('.chat-notice').textContent.includes('已排队 2 条');

      // Finishing that turn drains the queue: the held submissions become real requests, in
      // order, each with its own idempotency id.
      window.__holdTurn = false;
      if (window.__stream) window.__stream.finish();
      await settle();
      const sentTurns = (window.__sent || {})['/chat/sessions/chat_1/turns'];
      const drained = JSON.parse(sentTurns || '{}');
      checks.uiQueueDrains = (drained.content || '').includes('"region":"queued"') ||
        (drained.content || '').includes('"region":"again"');

      // The answer travels back into the page as it streams, and the directive is applied by the
      // page at the end of the turn.
      channel.seen.length = 0;
      window.__uiReply = true;
      formEvent(channel.port, { name: 'submit', label: '需要指令的提交', data: {} });
      await settle();
      window.__uiReply = false;
      const kinds = channel.seen.map((frame) => frame.k);
      checks.uiReplyDeltaRelayed = kinds.includes('d');
      checks.uiReplyDoneRelayed = kinds.includes('done');
      checks.uiReplyOpsRelayed = (channel.seen.filter((frame) => frame.k === 'done')[0] || {}).ops.length === 1;

      // Reloading the page after an answer: the module posts a fresh upload, and the new frame
      // starts a new channel. The old channel must be dead — otherwise two frames would answer
      // for one conversation.
      const sentBefore = (window.__sent || {})['/chat/sessions/chat_1/artifacts'];
      const reloadBtn = [...document.querySelectorAll('.modal-actions button')].find((b) => b.textContent.trim() === '重新加载');
      checks.uiReloadPresent = !!reloadBtn;
      if (reloadBtn) {
        reloadBtn.click();
        await settle();
        const sentAfter = (window.__sent || {})['/chat/sessions/chat_1/artifacts'];
        checks.uiReloadReuploads = sentAfter !== sentBefore;
        checks.uiReloadResetsBadge = document.querySelector('.modal .bridge-badge').textContent.includes('等待页面握手');
        // A reload is a new page: it must get its own secret rather than reuse the old one.
        const reloaded = JSON.parse(sentAfter || '{}');
        checks.uiReloadNewToken = typeof reloaded.bridge_token === 'string'
          && reloaded.bridge_token.length >= 16
          && reloaded.bridge_token !== JSON.parse(sentBefore || '{}').bridge_token;
      }

      // Closing the preview tears the channel down: the listener and the port go with the frame.
      const closeUi = [...document.querySelectorAll('.modal-actions button')].find((b) => b.textContent.trim() === '关闭');
      if (closeUi) closeUi.click();
      await settle();
      checks.uiClosed = !document.querySelector('.preview-frame');
    }

    // One question: the request must carry an idempotency key, and the stream must fold
    // into the bubble (text, tool card, notice) before the page reloads the conversation.
    const input = pageEl.querySelector('.chat-input');
    checks.composerPresent = !!input && !!find('发送') && !!find('停止');
    input.value = '这个月哪个模型最贵？';
    find('发送').click();
    await settle();
    const turnBody = JSON.parse((window.__sent || {})['/chat/sessions/chat_1/turns'] || '{}');
    checks.turnIdSent = typeof turnBody.turn_id === 'string' && turnBody.turn_id.length > 0;
    checks.turnContentSent = turnBody.content === '这个月哪个模型最贵？';
    checks.noticeShown = pageText().includes('流式回答已就绪');
    checks.afterTurnReloaded = (window.__fetched || []).filter((p) => p === '/chat/sessions/chat_1').length >= 2;
    checks.sample = {
      reloadCount: (window.__fetched || []).filter((p) => p === '/chat/sessions/chat_1').length,
      streamed: pageText().includes('让我先查一下'),
      toasts: [...document.querySelectorAll('.toast')].map((n) => n.textContent),
      notice: (pageEl.querySelector('.chat-notice') || {}).textContent || '',
    };

    // The "+" menu lists the operator's own skills with their loaded state, and offers to
    // create one from this conversation.
    find('＋').click();
    await settle();
    const menu = document.querySelector('.plus-menu');
    checks.plusMenu = !!menu;
    checks.plusCreate = !!menu && menu.textContent.includes('创建技能');
    checks.plusSkillRow = !!menu && !!menu.querySelector('.plus-skill input[type=checkbox]');
    checks.plusSkillChecked = !!menu && !!menu.querySelector('.plus-skill input[type=checkbox]').checked;
    checks.plusManage = !!menu && menu.textContent.includes('管理技能');
    if (menu) menu.remove();

    // 新建会话 — the dialog the operator reported as "MCP 令牌选择不了". The picker must keep
    // what was picked: rebuilding its option list from the change event throws that selection
    // away (removing the options resets the select, and the first option appended afterwards
    // becomes the selected one again), so these assertions read the picker *after* the change
    // rather than only checking that it was populated.
    find('新建会话').click();
    await settle();
    const newDialog = [...document.querySelectorAll('.modal')].pop();
    checks.newSessionDialogOpens = !!newDialog && newDialog.textContent.includes('新建会话');
    const tokenField = newDialog
      ? [...newDialog.querySelectorAll('label.field')].find((l) => l.textContent.includes('MCP 令牌'))
      : null;
    const tokenPicker = tokenField ? tokenField.querySelector('select') : null;
    checks.newSessionTokenOptions = !!tokenPicker && tokenPicker.options.length === 2
      && ![...tokenPicker.options].some((o) => o.textContent.includes('retired'));
    // Opening on the first usable token (admin_read) must already describe that token.
    checks.newSessionTokenHintOnOpen = !!newDialog && newDialog.textContent.includes('后台只读');
    if (tokenPicker) {
      const fetchesBefore = (window.__fetched || []).filter((p) => p === '/mcp-tokens').length;
      tokenPicker.value = '3';
      tokenPicker.dispatchEvent(new Event('change'));
      await settle();
      checks.newSessionTokenSelectionSticks = tokenPicker.value === '3' && tokenPicker.options.length === 2;
      checks.newSessionTokenHintUpdates = newDialog.textContent.includes('可执行全部控制台操作');
      checks.newSessionTokenNoRefetch =
        (window.__fetched || []).filter((p) => p === '/mcp-tokens').length === fetchesBefore;
      const createBtn = [...document.querySelectorAll('.modal-actions button')]
        .find((b) => b.textContent.trim() === '创建');
      checks.newSessionCreatePresent = !!createBtn;
      if (createBtn) {
        createBtn.click();
        await settle();
        const created = JSON.parse((window.__sent || {})['/chat/sessions'] || '{}');
        checks.newSessionCreateSendsChosenToken = created.mcp_token_id === 3;
      }
    }

    // Leaving the page must abort the stream (the shell calls the returned teardown).
    checks.teardown = typeof destroy === 'function';
    if (typeof destroy === 'function') destroy();
   } catch (err) {
     // A helper that throws must not cost the whole report: the checks collected so far are
     // exactly what says where it broke.
     checks.threwLate = String(err && err.stack ? String(err.stack).split('\n')[0] : err);
   }
  }

  if (view === 'skills') {
    await renderSkills({
      page: pageEl, actions: document.getElementById('actions'),
      session: { role: 'admin', username: 'admin' },
      route: { path: '/skills', params: new URLSearchParams('') },
      navigate: () => {},
    });
    await settle();
    checks.listRendered = pageText().includes('成本排查');
    checks.sourceLink = !!pageEl.querySelector('a[href="#/chat?session=chat_1"]');
    checks.privacyNote = pageText().includes('只属于当前登录账号');

    find('新建技能').click();
    await settle();
    checks.editorOpen = pageText().includes('新建技能');
    const nameInput = pageEl.querySelector('input[placeholder^="例如"]');
    const instructionsInput = pageEl.querySelector('textarea');
    checks.editorFields = !!nameInput && !!instructionsInput;
    if (nameInput && instructionsInput) {
      nameInput.value = '手写技能';
      nameInput.dispatchEvent(new Event('input'));
      instructionsInput.value = '第一步：查账户';
      instructionsInput.dispatchEvent(new Event('input'));
      find('创建并加载').click();
      await settle();
      const sent = JSON.parse((window.__sent || {})['/chat/skills'] || '{}');
      checks.createSent = sent.name === '手写技能' && (sent.instructions || '').includes('第一步');
    }

    const edit = find('编辑');
    checks.editButton = !!edit;
    if (edit) {
      edit.click();
      await settle();
      checks.editPrefilled = !!pageEl.querySelector('textarea') && pageEl.querySelector('textarea').value.includes('先查账户');
    }

    const remove = find('删除');
    checks.deleteButton = !!remove;
    if (remove) {
      remove.click();
      await settle();
      checks.deleteConfirm = !!document.querySelector('.modal') && document.body.textContent.includes('删除技能');
      const cancel = [...document.querySelectorAll('.modal button')].find((b) => b.textContent.trim() === '取消');
      if (cancel) cancel.click();
      await settle();
    }
  }
} catch (err) {
  report({ view, stage: 'threw', ok: false, checks, thrown: String(err && err.stack ? err.stack : err) });
  throw err;
}

const bad = Object.keys(checks).filter((key) => checks[key] === false);
// A failed assertion that carries a message (an error string collected above) or a non-boolean
// value is the most useful thing in the report, so it is surfaced as `sample` rather than left
// for whoever reads the JSON by hand.
const detail = {};
for (const key of Object.keys(checks)) {
  const value = checks[key];
  if (typeof value === 'string' && value) detail[key] = value;
}
report({ view, stage: 'done', ok: bad.length === 0, checks, failed: bad, sample: detail });
</script>
</body>
</html>
